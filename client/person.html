<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>HeartMatch • Profile</title>

    <style>
        :root {
            --bg: #090812;
            --card: #171421;
            --card-light: #211c2b;
            --text: #ffffff;
            --muted: #aaa5b8;
            --pink: #ff3f8e;
            --purple: #a855f7;
            --line: rgba(255, 255, 255, 0.1);
        }

        * {
            box-sizing: border-box;
        }

        html {
            min-width: 320px;
            background: var(--bg);
        }

        body {
            min-height: 100vh;
            margin: 0;
            overflow-x: hidden;
            color: var(--text);
            font-family: Arial, Helvetica, sans-serif;
            background:
                radial-gradient(
                    circle at 10% 0,
                    rgba(143, 54, 173, 0.35),
                    transparent 32%
                ),
                radial-gradient(
                    circle at 90% 100%,
                    rgba(91, 48, 160, 0.25),
                    transparent 35%
                ),
                var(--bg);
        }

        .wrap {
            width: min(820px, calc(100% - 32px));
            margin: 24px auto 60px;
        }

        .top {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 18px;
        }

        .back {
            color: #fff;
            font-size: 27px;
            line-height: 1;
            text-decoration: none;
        }

        .top strong {
            font-size: 15px;
        }

        .card {
            overflow: hidden;
            border: 1px solid var(--line);
            border-radius: 24px;
            background: var(--card);
            box-shadow: 0 25px 70px rgba(0, 0, 0, 0.45);
        }

        /*
         * The image area has a controlled height.
         * "contain" keeps the complete profile image visible.
         */
        .hero {
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
            height: min(58vw, 430px);
            min-height: 260px;
            padding: 12px;
            background:
                radial-gradient(
                    circle at center,
                    #3a2848,
                    #17121f 72%
                );
        }

        .hero img {
            display: block;
            width: 100%;
            height: 100%;
            object-fit: contain;
            object-position: center;
            border-radius: 15px;
            cursor: zoom-in;
        }

        .avatar {
            width: 130px;
            height: 130px;
            display: grid;
            place-items: center;
            border-radius: 50%;
            color: white;
            background: linear-gradient(
                135deg,
                var(--pink),
                var(--purple)
            );
            font-size: 46px;
            font-weight: 800;
        }

        .body {
            padding: clamp(20px, 4vw, 34px);
            background:
                linear-gradient(
                    145deg,
                    rgba(255, 255, 255, 0.07),
                    rgba(255, 255, 255, 0.025)
                ),
                var(--card);
        }

        .name {
            margin: 0;
            color: #fff;
            font-size: clamp(26px, 5vw, 38px);
            line-height: 1.15;
            overflow-wrap: anywhere;
        }

        .location {
            margin-top: 9px;
            color: var(--muted);
            font-size: 15px;
        }

        .profile-section {
            margin-top: 25px;
        }

        .section-label {
            margin-bottom: 8px;
            color: #ff91ba;
            font-size: 12px;
            font-weight: 800;
            letter-spacing: 0.12em;
            text-transform: uppercase;
        }

        .bio {
            margin: 0;
            color: #e5e1eb;
            font-size: 16px;
            line-height: 1.65;
            overflow-wrap: anywhere;
        }

        .chips {
            display: flex;
            flex-wrap: wrap;
            gap: 9px;
        }

        .chip {
            padding: 8px 12px;
            border: 1px solid rgba(168, 85, 247, 0.3);
            border-radius: 999px;
            color: #e2d7ff;
            background: rgba(168, 85, 247, 0.13);
            font-size: 13px;
        }

        .no-interests {
            color: var(--muted);
            font-size: 14px;
        }

        .profile-actions {
            width: 100%;
            margin-top: 28px;
            display: grid;
            grid-template-columns: repeat(2, minmax(0, 1fr));
            gap: 12px;
        }

        .profile-action-btn {
            width: 100%;
            min-height: 48px;
            padding: 13px 16px;
            border: 1px solid rgba(255, 255, 255, 0.12);
            border-radius: 13px;
            color: #fff;
            background: rgba(255, 255, 255, 0.06);
            font-weight: 800;
            cursor: pointer;
            transition: transform 0.2s, background 0.2s, box-shadow 0.2s, opacity 0.2s;
        }

        .profile-action-btn:hover {
            transform: translateY(-2px);
            background: rgba(255, 255, 255, 0.1);
        }

        .profile-action-btn:disabled {
            opacity: 0.55;
            cursor: wait;
            transform: none;
        }

        .profile-action-btn.like {
            background: linear-gradient(135deg, var(--pink), var(--purple));
            border-color: transparent;
            box-shadow: 0 12px 30px rgba(255, 63, 142, 0.2);
        }

        .profile-action-btn.like:hover {
            box-shadow: 0 16px 36px rgba(255, 63, 142, 0.3);
        }

        .profile-action-btn.danger {
            color: #ffd8e5;
        }

        .action-status {
            grid-column: 1 / -1;
            min-height: 20px;
            margin: 0;
            color: var(--muted);
            font-size: 13px;
            text-align: center;
        }

        @media (max-width: 600px) {
            .wrap {
                width: calc(100% - 24px);
                margin-top: 16px;
            }

            .card {
                border-radius: 19px;
            }

            .hero {
                height: min(76vw, 340px);
                min-height: 230px;
                padding: 8px;
            }

            .hero img {
                border-radius: 12px;
            }

            .body {
                padding: 21px 18px 22px;
            }

            .name {
                font-size: 28px;
            }

            .bio {
                font-size: 15px;
            }

            .profile-actions {
                margin-top: 24px;
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>

<body>
    <main class="wrap">
        <div class="top">
            <a
                class="back"
                href="javascript:history.back()"
                aria-label="Go back"
            >
                ←
            </a>

            <strong>Profile</strong>
        </div>

        <section class="card" id="card">
            <div class="body">Loading profile...</div>
        </section>
    </main>

    <script>
        const token = localStorage.getItem("token");
        const id = new URLSearchParams(
            window.location.search
        ).get("user");

        if (!token) {
            window.location.href = "login.html";
        }

        if (!id) {
            window.location.href = "matches.html";
        }

        const card = document.getElementById("card");

        function escapeHTML(value) {
            const div = document.createElement("div");
            div.textContent = value ?? "";
            return div.innerHTML;
        }

        async function loadProfile() {
            try {
                const response = await fetch(
                    "/api/person/" + encodeURIComponent(id),
                    {
                        headers: {
                            Authorization: "Bearer " + token
                        }
                    }
                );

                const data = await response.json();

                if (!response.ok) {
                    throw new Error(
                        data.message || "Profile not found"
                    );
                }

                const user = data.user;
                const name = escapeHTML(user.name || "User");
                const userIdLabel = escapeHTML(user.userId ? "@" + user.userId : "");
                const age = user.age != null
                    ? ", " + escapeHTML(user.age)
                    : "";

                const location = escapeHTML(
                    user.location || "Location not specified"
                );

                const bio = escapeHTML(
                    user.bio || "No bio yet."
                );

                const interests = (user.interests || [])
                    .map(
                        interest =>
                            `<span class="chip">${escapeHTML(interest)}</span>`
                    )
                    .join("");

                let profileImage = "";

                if (user.profileImage) {
                    profileImage = `
                        <img
                            id="profileImage"
                            src="${escapeHTML(user.profileImage)}"
                            alt="${name}'s profile photo"
                            title="Click to open full-size photo"
                        >
                    `;
                } else {
                    profileImage = `
                        <div class="avatar">
                            ${escapeHTML(
                                (user.name || "?")
                                    .charAt(0)
                                    .toUpperCase()
                            )}
                        </div>
                    `;
                }

                card.innerHTML = `
                    <div class="hero">
                        ${profileImage}
                    </div>

                    <div class="body">
                        <h1 class="name">
                            ${name}${age}
                        </h1>

                        <div class="location">
                            📍 ${location}
                        </div>

                        <section class="profile-section">
                            <div class="section-label">
                                About
                            </div>

                            <p class="bio">
                                ${bio}
                            </p>
                        </section>

                        <section class="profile-section">
                            <div class="section-label">
                                Interests
                            </div>

                            <div class="chips">
                                ${
                                    interests ||
                                    '<span class="no-interests">No interests added</span>'
                                }
                            </div>
                        </section>

                        <div class="profile-actions">
                            <button class="profile-action-btn like" id="likeButton" type="button">❤️ Like</button>
                            <button class="profile-action-btn" id="passButton" type="button">👋 Pass</button>
                            <button class="profile-action-btn danger" id="reportButton" type="button">🚩 Report</button>
                            <button class="profile-action-btn danger" id="blockButton" type="button">🚫 Block</button>
                            <p class="action-status" id="actionStatus" aria-live="polite"></p>
                        </div>
                    </div>
                `;

                const profileImageElement =
                    document.getElementById("profileImage");

                if (profileImageElement) {
                    profileImageElement.addEventListener(
                        "click",
                        () => {
                            window.open(
                                user.profileImage,
                                "_blank",
                                "noopener,noreferrer"
                            );
                        }
                    );
                }

                const likeButton = document.getElementById("likeButton");
                const passButton = document.getElementById("passButton");
                const reportButton = document.getElementById("reportButton");
                const blockButton = document.getElementById("blockButton");
                const actionStatus = document.getElementById("actionStatus");
                const targetObjectId = String(user._id || "");

                function setActionState(disabled) {
                    [likeButton, passButton, reportButton, blockButton].forEach((button) => {
                        if (button) button.disabled = disabled;
                    });
                }

                function showActionStatus(message) {
                    if (actionStatus) actionStatus.textContent = message || "";
                }

                async function sendLikeOrPass(type) {
                    if (!targetObjectId) {
                        showActionStatus("This profile cannot be acted on right now.");
                        return;
                    }

                    setActionState(true);
                    showActionStatus(type === "like" ? "Liking..." : "Passing...");

                    try {
                        const response = await fetch("/api/likes", {
                            method: "POST",
                            headers: {
                                "Content-Type": "application/json",
                                Authorization: "Bearer " + token
                            },
                            body: JSON.stringify({
                                to: targetObjectId,
                                type
                            })
                        });

                        const data = await response.json().catch(() => ({}));

                        if (!response.ok) {
                            throw new Error(data.message || "Action failed");
                        }

                        showActionStatus(
                            type === "like"
                                ? (data.matched ? "It's a match! ❤️💕" : "Liked ❤️")
                                : "Passed 👋"
                        );
                    } catch (error) {
                        console.error("Profile action error:", error);
                        showActionStatus(error.message || "Action failed. Please try again.");
                    } finally {
                        setActionState(false);
                    }
                }

                async function blockProfile() {
                    if (!targetObjectId) return;
                    if (!confirm("Block this user?")) return;

                    setActionState(true);
                    showActionStatus("Blocking...");

                    try {
                        const response = await fetch(
                            "/api/blocks/" + encodeURIComponent(targetObjectId),
                            {
                                method: "POST",
                                headers: {
                                    Authorization: "Bearer " + token
                                }
                            }
                        );
                        const data = await response.json().catch(() => ({}));

                        if (!response.ok) {
                            throw new Error(data.message || "Could not block this user.");
                        }

                        showActionStatus("User blocked.");
                        setTimeout(() => {
                            window.location.href = "discover.html";
                        }, 500);
                    } catch (error) {
                        console.error("Block error:", error);
                        showActionStatus(error.message || "Could not block this user.");
                        setActionState(false);
                    }
                }

                async function reportProfile() {
                    if (!targetObjectId) return;
                    const reason = prompt("Why are you reporting this profile?");
                    if (!reason || !reason.trim()) return;

                    setActionState(true);
                    showActionStatus("Submitting report...");

                    try {
                        const response = await fetch(
                            "/api/reports/" + encodeURIComponent(targetObjectId),
                            {
                                method: "POST",
                                headers: {
                                    "Content-Type": "application/json",
                                    Authorization: "Bearer " + token
                                },
                                body: JSON.stringify({ reason: reason.trim() })
                            }
                        );
                        const data = await response.json().catch(() => ({}));

                        if (!response.ok) {
                            throw new Error(data.message || "Could not submit report.");
                        }

                        showActionStatus(data.message || "Report submitted. Thank you.");
                    } catch (error) {
                        console.error("Report error:", error);
                        showActionStatus(error.message || "Could not submit report.");
                    } finally {
                        setActionState(false);
                    }
                }

                likeButton.addEventListener("click", () => sendLikeOrPass("like"));
                passButton.addEventListener("click", () => sendLikeOrPass("pass"));
                reportButton.addEventListener("click", reportProfile);
                blockButton.addEventListener("click", blockProfile);
            } catch (error) {
                card.innerHTML = `
                    <div class="body">
                        😕 ${escapeHTML(error.message)}
                    </div>
                `;
            }
        }

        loadProfile();
    </script>
</body>
</html>
