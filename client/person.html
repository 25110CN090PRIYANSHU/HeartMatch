<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>HeartMatch • Profile</title>
    <link rel="manifest" href="/manifest.json">
    <meta name="theme-color" content="#090812">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="HeartMatch">
    <link rel="apple-touch-icon" href="/images/icons/apple-touch-icon.png">
  <link rel="icon" type="image/png" sizes="192x192" href="/images/icons/icon-192.png">
  <link rel="icon" type="image/png" sizes="512x512" href="/images/icons/icon-512.png">
  <link rel="icon" type="image/svg+xml" href="/images/icons/icon.svg">
  <link rel="icon" type="image/x-icon" href="/favicon.ico">
    <style>
        :root {
            --bg: #090812;
            --card: #171421;
            --card-light: #211c2b;
            --text: #ffffff;
            --muted: #aaa5b8;
            --pink: #ff3f8e;
            --purple: #a855f7;
            --line: rgba(255, 255, 255, 0.1);
        }

        * {
            box-sizing: border-box;
        }

        html {
            min-width: 320px;
            background: var(--bg);
        }

        body {
            min-height: 100vh;
            margin: 0;
            overflow-x: hidden;
            color: var(--text);
            font-family: Arial, Helvetica, sans-serif;
            background:
                radial-gradient(
                    circle at 10% 0,
                    rgba(143, 54, 173, 0.35),
                    transparent 32%
                ),
                radial-gradient(
                    circle at 90% 100%,
                    rgba(91, 48, 160, 0.25),
                    transparent 35%
                ),
                var(--bg);
        }

        .wrap {
            width: min(820px, calc(100% - 32px));
            margin: 24px auto 60px;
        }

        .top {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 18px;
        }

        .back {
            color: #fff;
            font-size: 27px;
            line-height: 1;
            text-decoration: none;
        }

        .top strong {
            font-size: 15px;
        }

        .card {
            overflow: hidden;
            border: 1px solid var(--line);
            border-radius: 24px;
            background: var(--card);
            box-shadow: 0 25px 70px rgba(0, 0, 0, 0.45);
        }

        /*
         * The image area has a controlled height.
         * "contain" keeps the complete profile image visible.
         */
        .hero {
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
            height: min(58vw, 430px);
            min-height: 260px;
            padding: 12px;
            background:
                radial-gradient(
                    circle at center,
                    #3a2848,
                    #17121f 72%
                );
        }

        .hero img {
            display: block;
            width: 100%;
            height: 100%;
            object-fit: contain;
            object-position: center;
            border-radius: 15px;
            cursor: zoom-in;
        }

        .avatar {
            width: 130px;
            height: 130px;
            display: grid;
            place-items: center;
            border-radius: 50%;
            color: white;
            background: linear-gradient(
                135deg,
                var(--pink),
                var(--purple)
            );
            font-size: 46px;
            font-weight: 800;
        }

        .body {
            padding: clamp(20px, 4vw, 34px);
            background:
                linear-gradient(
                    145deg,
                    rgba(255, 255, 255, 0.07),
                    rgba(255, 255, 255, 0.025)
                ),
                var(--card);
        }

        .name {
            margin: 0;
            color: #fff;
            font-size: clamp(26px, 5vw, 38px);
            line-height: 1.15;
            overflow-wrap: anywhere;
        }

        .location {
            margin-top: 9px;
            color: var(--muted);
            font-size: 15px;
        }

        .profile-section {
            margin-top: 25px;
        }

        .section-label {
            margin-bottom: 8px;
            color: #ff91ba;
            font-size: 12px;
            font-weight: 800;
            letter-spacing: 0.12em;
            text-transform: uppercase;
        }

        .bio {
            margin: 0;
            color: #e5e1eb;
            font-size: 16px;
            line-height: 1.65;
            overflow-wrap: anywhere;
        }

        .chips {
            display: flex;
            flex-wrap: wrap;
            gap: 9px;
        }

        .chip {
            padding: 8px 12px;
            border: 1px solid rgba(168, 85, 247, 0.3);
            border-radius: 999px;
            color: #e2d7ff;
            background: rgba(168, 85, 247, 0.13);
            font-size: 13px;
        }

        .no-interests {
            color: var(--muted);
            font-size: 14px;
        }

        /* Carousel & Feature Styles */
        .carousel-btn {
            position: absolute;
            top: 50%;
            transform: translateY(-50%);
            width: 38px;
            height: 38px;
            border-radius: 50%;
            background: rgba(18, 14, 28, 0.75);
            backdrop-filter: blur(6px);
            border: 1px solid rgba(255, 255, 255, 0.2);
            color: #fff;
            display: grid;
            place-items: center;
            font-size: 16px;
            cursor: pointer;
            z-index: 5;
            transition: 0.2s;
        }
        .carousel-btn:hover {
            background: rgba(255, 63, 142, 0.8);
            border-color: #ff3f8e;
            transform: translateY(-50%) scale(1.08);
        }
        .carousel-btn.prev { left: 12px; }
        .carousel-btn.next { right: 12px; }
        .carousel-dots {
            position: absolute;
            bottom: 14px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            gap: 6px;
            z-index: 5;
        }
        .carousel-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.35);
            cursor: pointer;
            transition: all 0.2s ease;
        }
        .carousel-dot.active {
            width: 22px;
            border-radius: 10px;
            background: #ff3f8e;
        }
        .person-compat-badge {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            padding: 5px 12px;
            border-radius: 999px;
            background: linear-gradient(135deg, rgba(255, 63, 142, 0.2), rgba(168, 85, 247, 0.25));
            border: 1px solid rgba(255, 63, 142, 0.45);
            font-size: 13px;
            font-weight: 700;
            color: #ffd6e7;
        }
        .person-intent-pill {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            padding: 5px 12px;
            border-radius: 8px;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.12);
            font-size: 13px;
            color: #e0dced;
        }
        .prompt-quote-card {
            background: linear-gradient(135deg, rgba(255, 255, 255, 0.04), rgba(255, 255, 255, 0.015));
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-left: 3px solid #ff3f8e;
            border-radius: 14px;
            padding: 14px 18px;
            margin-top: 10px;
        }
        .prompt-quote-q {
            font-size: 11px;
            font-weight: 800;
            color: #ff91ba;
            text-transform: uppercase;
            letter-spacing: 0.08em;
            margin-bottom: 6px;
        }
        .prompt-quote-a {
            font-size: 15px;
            color: #fff;
            line-height: 1.55;
            font-style: italic;
        }

        .profile-actions {
            width: 100%;
            margin-top: 28px;
            display: grid;
            grid-template-columns: repeat(2, minmax(0, 1fr));
            gap: 12px;
        }

        .profile-action-btn {
            width: 100%;
            min-height: 48px;
            padding: 13px 16px;
            border: 1px solid rgba(255, 255, 255, 0.12);
            border-radius: 13px;
            color: #fff;
            background: rgba(255, 255, 255, 0.06);
            font-weight: 800;
            cursor: pointer;
            transition: transform 0.2s, background 0.2s, box-shadow 0.2s, opacity 0.2s;
        }

        .profile-action-btn:hover {
            transform: translateY(-2px);
            background: rgba(255, 255, 255, 0.1);
        }

        .profile-action-btn:disabled {
            opacity: 0.55;
            cursor: wait;
            transform: none;
        }

        .profile-action-btn.like {
            background: linear-gradient(135deg, var(--pink), var(--purple));
            border-color: transparent;
            box-shadow: 0 12px 30px rgba(255, 63, 142, 0.2);
        }

        .profile-action-btn.like:hover {
            box-shadow: 0 16px 36px rgba(255, 63, 142, 0.3);
        }

        .profile-action-btn.danger {
            color: #ffd8e5;
        }

        .action-status {
            grid-column: 1 / -1;
            min-height: 20px;
            margin: 0;
            color: var(--muted);
            font-size: 13px;
            text-align: center;
        }

        @media (max-width: 600px) {
            .wrap {
                width: calc(100% - 24px);
                margin-top: 16px;
            }

            .card {
                border-radius: 19px;
            }

            .hero {
                height: min(76vw, 340px);
                min-height: 230px;
                padding: 8px;
            }

            .hero img {
                border-radius: 12px;
            }

            .body {
                padding: 21px 18px 22px;
            }

            .name {
                font-size: 28px;
            }

            .bio {
                font-size: 15px;
            }

            .profile-actions {
                margin-top: 24px;
                grid-template-columns: 1fr;
            }
        }
    </style>
  <link rel="stylesheet" href="css/animated-ui.css">
  <link rel="stylesheet" href="css/responsive.css">
</head>

<body>
    <main class="wrap">
        <div class="top">
            <a
                class="back"
                href="javascript:history.back()"
                aria-label="Go back"
            >
                ←
            </a>

            <strong>Profile</strong>
        </div>

        <section class="card" id="card">
            <div class="body">Loading profile...</div>
        </section>
    </main>

    <script>
        const token = localStorage.getItem("token");
        const id = new URLSearchParams(
            window.location.search
        ).get("user");

        if (!token) {
            window.location.href = "login.html";
        }

        if (!id) {
            window.location.href = "matches.html";
        }

        const card = document.getElementById("card");

        function escapeHTML(value) {
            const div = document.createElement("div");
            div.textContent = value ?? "";
            return div.innerHTML;
        }

        async function loadProfile() {
            try {
                const response = await fetch(
                    "/api/person/" + encodeURIComponent(id),
                    {
                        headers: {
                            Authorization: "Bearer " + token
                        }
                    }
                );

                const data = await response.json();

                if (!response.ok) {
                    throw new Error(
                        data.message || "Profile not found"
                    );
                }

                const user = data.user;
                const name = escapeHTML(user.name || "User");
                const userIdLabel = escapeHTML(user.userId ? "@" + user.userId : "");
                const age = user.age != null
                    ? ", " + escapeHTML(user.age)
                    : "";

                const location = escapeHTML(
                    user.location || "Location not specified"
                );

                const bio = escapeHTML(
                    user.bio || "No bio yet."
                );

                const interests = (user.interests || [])
                    .map(
                        interest =>
                            `<span class="chip">${escapeHTML(interest)}</span>`
                    )
                    .join("");

                const photos = Array.isArray(user.photos) && user.photos.length > 0
                    ? user.photos
                    : (user.profileImage ? [user.profileImage] : []);

                let heroHTML = "";
                if (photos.length > 1) {
                    heroHTML = `
                        <button class="carousel-btn prev" id="carouselPrev" type="button" aria-label="Previous photo">‹</button>
                        <img id="profileImage" src="${escapeHTML(photos[0])}" alt="${name}'s photo" title="Click to open full-size photo" />
                        <button class="carousel-btn next" id="carouselNext" type="button" aria-label="Next photo">›</button>
                        <div class="carousel-dots" id="carouselDots">
                            ${photos.map((_, i) => `<span class="carousel-dot ${i === 0 ? "active" : ""}" data-idx="${i}"></span>`).join("")}
                        </div>
                    `;
                } else if (photos.length === 1) {
                    heroHTML = `
                        <img id="profileImage" src="${escapeHTML(photos[0])}" alt="${name}'s profile photo" title="Click to open full-size photo" />
                    `;
                } else {
                    heroHTML = `
                        <div class="avatar">
                            ${escapeHTML((user.name || "?").charAt(0).toUpperCase())}
                        </div>
                    `;
                }

                const intentLabels = {
                    "long-term": "💍 Long-term relationship",
                    "casual": "☕ Casual dating",
                    "friends": "🤝 New friends",
                    "not-sure": "🤔 Not sure yet",
                    "any": "✨ Open to anything"
                };
                const intentHTML = user.lookingFor && intentLabels[user.lookingFor]
                    ? `<span class="person-intent-pill">${escapeHTML(intentLabels[user.lookingFor])}</span>`
                    : "";

                const compatHTML = user.compatibility
                    ? `<span class="person-compat-badge">⚡ ${user.compatibility}% Match</span>`
                    : "";

                const promptsHTML = Array.isArray(user.prompts) && user.prompts.length > 0
                    ? `
                        <section class="profile-section">
                            <div class="section-label">Icebreakers & Prompts 💬</div>
                            <div class="prompts-list">
                                ${user.prompts.filter(p => p.question && p.answer).map(p => `
                                    <div class="prompt-quote-card">
                                        <div class="prompt-quote-q">${escapeHTML(p.question)}</div>
                                        <div class="prompt-quote-a">"${escapeHTML(p.answer)}"</div>
                                    </div>
                                `).join("")}
                            </div>
                        </section>
                    `
                    : "";

                card.innerHTML = `
                    <div class="hero">
                        ${heroHTML}
                    </div>

                    <div class="body">
                        <div style="display:flex; justify-content:space-between; align-items:flex-start; flex-wrap:wrap; gap:10px;">
                            <div>
                                <h1 class="name">
                                    ${name}${age}
                                </h1>
                                <div class="location">
                                    📍 ${location}
                                </div>
                            </div>
                        </div>

                        ${(compatHTML || intentHTML) ? `
                            <div style="display:flex; flex-wrap:wrap; gap:8px; align-items:center; margin-top:14px;">
                                ${compatHTML}
                                ${intentHTML}
                            </div>
                        ` : ""}

                        <section class="profile-section">
                            <div class="section-label">
                                About
                            </div>

                            <p class="bio">
                                ${bio}
                            </p>
                        </section>

                        ${promptsHTML}

                        <section class="profile-section">
                            <div class="section-label">
                                Interests
                            </div>

                            <div class="chips">
                                ${
                                    interests ||
                                    '<span class="no-interests">No interests added</span>'
                                }
                            </div>
                        </section>

                        <div class="profile-actions">
                            <button class="profile-action-btn like" id="likeButton" type="button">❤️ Like</button>
                            <button class="profile-action-btn" id="passButton" type="button">👋 Pass</button>
                            <button class="profile-action-btn danger" id="reportButton" type="button">🚩 Report</button>
                            <button class="profile-action-btn danger" id="blockButton" type="button">🚫 Block</button>
                            <p class="action-status" id="actionStatus" aria-live="polite"></p>
                        </div>
                    </div>
                `;

                // Handle carousel interaction
                let curIdx = 0;
                const profileImageElement = document.getElementById("profileImage");
                const prevBtn = document.getElementById("carouselPrev");
                const nextBtn = document.getElementById("carouselNext");
                const dotsContainer = document.getElementById("carouselDots");

                function setCarousel(idx) {
                    if (photos.length <= 1) return;
                    curIdx = (idx + photos.length) % photos.length;
                    if (profileImageElement) {
                        profileImageElement.src = photos[curIdx];
                    }
                    if (dotsContainer) {
                        const dots = dotsContainer.querySelectorAll(".carousel-dot");
                        dots.forEach((d, i) => d.classList.toggle("active", i === curIdx));
                    }
                }

                if (prevBtn) prevBtn.onclick = (e) => { e.stopPropagation(); setCarousel(curIdx - 1); };
                if (nextBtn) nextBtn.onclick = (e) => { e.stopPropagation(); setCarousel(curIdx + 1); };
                if (dotsContainer) {
                    dotsContainer.onclick = (e) => {
                        const d = e.target.closest(".carousel-dot");
                        if (d && d.dataset.idx != null) {
                            setCarousel(parseInt(d.dataset.idx, 10));
                        }
                    };
                }

                if (profileImageElement) {
                    profileImageElement.addEventListener("error", () => {
                        const fallback = document.createElement("div");
                        fallback.className = "avatar";
                        fallback.textContent = (user.name || "?").charAt(0).toUpperCase();
                        profileImageElement.replaceWith(fallback);
                    }, { once: true });

                    profileImageElement.addEventListener("click", () => {
                        const activeSrc = photos[curIdx] || user.profileImage;
                        if (activeSrc) window.open(activeSrc, "_blank", "noopener,noreferrer");
                    });
                }

                const likeButton = document.getElementById("likeButton");
                const passButton = document.getElementById("passButton");
                const reportButton = document.getElementById("reportButton");
                const blockButton = document.getElementById("blockButton");
                const actionStatus = document.getElementById("actionStatus");
                const targetObjectId = String(user._id || "");

                // Load the relationship state so a recipient can immediately see "Like Back".
                try {
                    const statusResponse = await fetch(
                        "/api/likes/status/" + encodeURIComponent(targetObjectId),
                        { headers: { Authorization: "Bearer " + token } }
                    );
                    const status = await statusResponse.json().catch(() => ({}));
                    if (statusResponse.ok && status.canLikeBack) {
                        likeButton.textContent = "💗 Like Back";
                    } else if (statusResponse.ok && status.likedByMe) {
                        likeButton.textContent = "❤️ Liked";
                    }
                } catch (statusError) {
                    console.warn("Could not load like status:", statusError);
                }

                function setActionState(disabled) {
                    [likeButton, passButton, reportButton, blockButton].forEach((button) => {
                        if (button) button.disabled = disabled;
                    });
                }

                function showActionStatus(message) {
                    if (actionStatus) actionStatus.textContent = message || "";
                }

                async function sendLikeOrPass(type) {
                    if (!targetObjectId) {
                        showActionStatus("This profile cannot be acted on right now.");
                        return;
                    }

                    setActionState(true);
                    showActionStatus(type === "like" ? "Liking..." : "Passing...");

                    try {
                        const response = await fetch("/api/likes", {
                            method: "POST",
                            headers: {
                                "Content-Type": "application/json",
                                Authorization: "Bearer " + token
                            },
                            body: JSON.stringify({
                                to: targetObjectId,
                                type
                            })
                        });

                        const data = await response.json().catch(() => ({}));

                        if (!response.ok) {
                            throw new Error(data.message || "Action failed");
                        }

                        showActionStatus(
                            type === "like"
                                ? (data.matched ? "It's a match! ❤️💕" : "Liked ❤️")
                                : "Passed 👋"
                        );
                        if (type === "like") {
                            likeButton.textContent = data.matched ? "💕 Matched" : "❤️ Liked";
                        }
                    } catch (error) {
                        console.error("Profile action error:", error);
                        showActionStatus(error.message || "Action failed. Please try again.");
                    } finally {
                        setActionState(false);
                    }
                }

                async function blockProfile() {
                    if (!targetObjectId) return;
                    if (!confirm("Block this user?")) return;

                    setActionState(true);
                    showActionStatus("Blocking...");

                    try {
                        const response = await fetch(
                            "/api/blocks/" + encodeURIComponent(targetObjectId),
                            {
                                method: "POST",
                                headers: {
                                    Authorization: "Bearer " + token
                                }
                            }
                        );
                        const data = await response.json().catch(() => ({}));

                        if (!response.ok) {
                            throw new Error(data.message || "Could not block this user.");
                        }

                        showActionStatus("User blocked.");
                        setTimeout(() => {
                            window.location.href = "discover.html";
                        }, 500);
                    } catch (error) {
                        console.error("Block error:", error);
                        showActionStatus(error.message || "Could not block this user.");
                        setActionState(false);
                    }
                }

                async function reportProfile() {
                    if (!targetObjectId) return;
                    const reason = prompt("Why are you reporting this profile?");
                    if (!reason || !reason.trim()) return;

                    setActionState(true);
                    showActionStatus("Submitting report...");

                    try {
                        const response = await fetch(
                            "/api/reports/" + encodeURIComponent(targetObjectId),
                            {
                                method: "POST",
                                headers: {
                                    "Content-Type": "application/json",
                                    Authorization: "Bearer " + token
                                },
                                body: JSON.stringify({ reason: reason.trim() })
                            }
                        );
                        const data = await response.json().catch(() => ({}));

                        if (!response.ok) {
                            throw new Error(data.message || "Could not submit report.");
                        }

                        showActionStatus(data.message || "Report submitted. Thank you.");
                    } catch (error) {
                        console.error("Report error:", error);
                        showActionStatus(error.message || "Could not submit report.");
                    } finally {
                        setActionState(false);
                    }
                }

                likeButton.addEventListener("click", () => sendLikeOrPass("like"));
                passButton.addEventListener("click", () => sendLikeOrPass("pass"));
                reportButton.addEventListener("click", reportProfile);
                blockButton.addEventListener("click", blockProfile);
            } catch (error) {
                card.innerHTML = `
                    <div class="body">
                        😕 ${escapeHTML(error.message)}
                    </div>
                `;
            }
        }

        loadProfile();
    </script>
  <script src="js/animated-ui.js"></script>
  <script src="/js/pwa-install.js" defer></script>
</body>
</html>
