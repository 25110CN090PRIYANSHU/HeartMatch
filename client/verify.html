<!doctype html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Verify — HeartMatch</title><link rel="stylesheet" href="/css/app.css"></head><body><main class="form card"><h1>Email verification ✓</h1><div id="msg" class="msg">Verifying...</div><a class="btn" href="login.html" style="display:block;text-align:center">Go to login</a></main><script>fetch('/api/auth/verify?token='+encodeURIComponent(new URLSearchParams(location.search).get('token')||'')).then(r=>r.json()).then(d=>document.getElementById('msg').textContent=d.message||'Done').catch(()=>document.getElementById('msg').textContent='Verification failed')</script><script src="/js/global-call.js"></script>
</body></html>
