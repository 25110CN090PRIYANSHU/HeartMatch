<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#181126" />
      <stop offset="100%" stop-color="#090812" />
    </linearGradient>
    <linearGradient id="heartGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff4d8d" />
      <stop offset="50%" stop-color="#ff3366" />
      <stop offset="100%" stop-color="#9333ea" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    <linearGradient id="shineGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.45" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0" />
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)" />
  <rect width="506" height="506" x="3" y="3" rx="109" fill="none" stroke="rgba(255,255,255,0.14)" stroke-width="3" />

  <!-- Outer Glow Heart -->
  <path d="M256 420 C256 420 80 300 80 188 C80 126 128 80 190 80 C226 80 256 106 256 106 C256 106 286 80 322 80 C384 80 432 126 432 188 C432 300 256 420 256 420 Z" 
        fill="url(#heartGrad)" filter="url(#glow)" opacity="0.45" />

  <!-- Main Heart -->
  <path d="M256 414 C256 414 88 298 88 190 C88 132 134 88 192 88 C226 88 256 112 256 112 C256 112 286 88 320 88 C378 88 424 132 424 190 C424 298 256 414 256 414 Z" 
        fill="url(#heartGrad)" />

  <!-- Inner Spark Highlight -->
  <path d="M256 160 L266 220 L320 230 L270 250 L280 310 L242 265 L190 270 L232 235 Z" 
        fill="#ffffff" opacity="0.88" />
  
  <!-- Subtle Heart Shine -->
  <path d="M192 108 C150 108 116 140 114 184 C112 220 134 262 168 298 C150 258 142 224 146 190 C150 148 172 122 198 114 C196 112 194 110 192 108 Z" 
        fill="url(#shineGrad)" />
</svg>
