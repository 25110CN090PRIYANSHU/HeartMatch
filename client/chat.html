<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />

    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>HeartMatch - Chat</title>

    <script src="https://cdn.socket.io/4.8.1/socket.io.min.js"></script>

    <style>
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }

      body {
        font-family: Arial, sans-serif;

        background:
          radial-gradient(circle at top left, #2b1238, transparent 35%),
          radial-gradient(circle at bottom right, #24103c, transparent 35%),
          #090812;

        color: white;

        min-height: 100vh;
      }

      /* =========================
           NAVBAR
        ========================= */

      nav {
        height: 70px;

        display: flex;

        align-items: center;

        justify-content: space-between;

        padding: 0 7%;

        border-bottom: 1px solid rgba(255, 255, 255, 0.08);

        background: rgba(10, 8, 18, 0.8);

        backdrop-filter: blur(15px);
      }

      .logo {
        font-size: 25px;

        font-weight: bold;

        background: linear-gradient(90deg, #ff4f9a, #a855f7);

        -webkit-background-clip: text;

        color: transparent;
      }

      .nav-links {
        display: flex;

        gap: 25px;
      }

      .nav-links a {
        color: #bbb;

        text-decoration: none;

        font-size: 14px;

        transition: 0.2s;
      }

      .nav-links a:hover {
        color: white;
      }

      /* =========================
           CHAT
        ========================= */

      .chat-container {
        width: min(1000px, 94%);

        height: calc(100vh - 110px);

        margin: 20px auto;

        display: flex;

        flex-direction: column;

        background: rgba(20, 17, 31, 0.8);

        border: 1px solid rgba(255, 255, 255, 0.08);

        border-radius: 20px;

        overflow: hidden;

        box-shadow: 0 20px 60px rgba(0, 0, 0, 0.4);
      }

      /* =========================
           CHAT HEADER
        ========================= */

      .chat-header {
        display: flex;

        align-items: center;

        gap: 14px;

        padding: 15px 20px;

        border-bottom: 1px solid rgba(255, 255, 255, 0.08);

        background: rgba(255, 255, 255, 0.03);
      }

      .back {
        font-size: 25px;

        color: #aaa;

        text-decoration: none;
      }

      .profile-photo {
        width: 45px;

        height: 45px;

        border-radius: 50%;

        object-fit: cover;

        background: linear-gradient(135deg, #ff4f9a, #a855f7);

        display: flex;

        align-items: center;

        justify-content: center;

        font-size: 20px;

        font-weight: bold;

        overflow: hidden;
      }

      .profile-photo img {
        width: 100%;

        height: 100%;

        object-fit: cover;
        cursor: zoom-in;
      }

      .user-info {
        flex: 1;
      }

      .user-info h2 {
        font-size: 17px;
      }

      /* =========================
           ONLINE STATUS
        ========================= */

      .online-status {
        font-size: 12px;

        color: #777;

        margin-top: 3px;

        display: flex;

        align-items: center;

        gap: 5px;
      }

      .status-dot {
        width: 7px;

        height: 7px;

        border-radius: 50%;

        background: #777;

        display: inline-block;
      }

      .online-status.online {
        color: #4ade80;
      }

      .online-status.online .status-dot {
        background: #4ade80;

        box-shadow: 0 0 8px rgba(74, 222, 128, 0.7);
      }

      .online-status.offline {
        color: #777;
      }

      .online-status.offline .status-dot {
        background: #777;
      }

      /* =========================
           MESSAGES
        ========================= */

      .messages {
        flex: 1;

        overflow-y: auto;

        padding: 25px;

        display: flex;

        flex-direction: column;

        gap: 10px;
      }

      .messages::-webkit-scrollbar {
        width: 6px;
      }

      .messages::-webkit-scrollbar-thumb {
        background: #444;

        border-radius: 10px;
      }

      .message-row {
        display: flex;
      }

      .message-row.mine {
        justify-content: flex-end;
      }

      .message {
        max-width: 70%;

        padding: 11px 15px;

        border-radius: 18px;

        background: #292535;

        color: #eee;

        word-break: break-word;
      }

      .message-row.mine .message {
        background: linear-gradient(135deg, #ff3f8e, #a855f7);

        color: white;

        border-bottom-right-radius: 5px;
      }

      .message-row:not(.mine) .message {
        border-bottom-left-radius: 5px;
      }

      .message-time {
        font-size: 10px;

        opacity: 0.55;

        margin-top: 5px;

        text-align: right;
      }

      /* =========================
           EMPTY CHAT
        ========================= */

      .empty-chat {
        margin: auto;

        text-align: center;

        color: #777;
      }

      .empty-chat .heart {
        font-size: 45px;

        margin-bottom: 10px;
      }

      /* =========================
           TYPING
        ========================= */

      .typing {
        height: 25px;

        padding-left: 25px;

        font-size: 12px;

        color: #777;
      }

      /* =========================
           TYPING INDICATOR
        ========================= */

      .typing {
        height: 25px;
        padding-left: 25px;
        font-size: 12px;
        color: #777;
        display: flex;
        align-items: center;
        gap: 4px;
      }

      .typing.active {
        color: #aaa;
      }

      .typing-dots {
        display: none;
        align-items: center;
        gap: 3px;
      }

      .typing.active .typing-dots {
        display: inline-flex;
      }

      .typing-dots span {
        width: 5px;
        height: 5px;
        border-radius: 50%;
        background: #ff4f9a;
        animation: typingBounce 1.2s infinite;
      }

      .typing-dots span:nth-child(2) {
        animation-delay: 0.15s;
      }

      .typing-dots span:nth-child(3) {
        animation-delay: 0.3s;
      }

      @keyframes typingBounce {
        0%,
        60%,
        100% {
          transform: translateY(0);
          opacity: 0.4;
        }

        30% {
          transform: translateY(-4px);
          opacity: 1;
        }
      }

      /* =========================
           INPUT
        ========================= */

      .chat-input {
        display: flex;

        gap: 10px;

        padding: 15px 20px;

        border-top: 1px solid rgba(255, 255, 255, 0.08);

        background: rgba(255, 255, 255, 0.03);
      }

      .chat-input input {
        flex: 1;

        border: none;

        outline: none;

        padding: 13px 17px;

        border-radius: 30px;

        background: #24212f;

        color: white;

        font-size: 14px;
      }

      .chat-input input::placeholder {
        color: #777;
      }

      .send-btn {
        width: 48px;

        height: 48px;

        border: none;

        border-radius: 50%;

        cursor: pointer;

        background: linear-gradient(135deg, #ff3f8e, #a855f7);

        color: white;

        font-size: 18px;

        transition: 0.2s;
      }

      .send-btn:hover {
        transform: scale(1.05);
      }

      .send-btn:disabled {
        opacity: 0.5;

        cursor: not-allowed;
      }

      /* =========================
           LOADING
        ========================= */

      .loading {
        margin: auto;

        color: #888;
      }

      /* =========================
           MOBILE
        ========================= */

      @media (max-width: 600px) {
        nav {
          height: auto;
          min-height: 70px;
          padding: 10px 4%;
          gap: 8px;
          flex-wrap: wrap;
        }

        .nav-links {
          width: 100%;
          gap: 14px;
          overflow-x: auto;
          padding-bottom: 2px;
          scrollbar-width: none;
        }

        .nav-links::-webkit-scrollbar {
          display: none;
        }

        .nav-links a {
          font-size: 12px;
        }

        .chat-container {
          width: 100%;

          height: calc(100dvh - 112px);
          min-height: 420px;

          margin: 0;

          border-radius: 0;
        }

        .chat-header {
          padding: 12px;
          gap: 9px;
        }

        .user-info h2 {
          max-width: 38vw;
          overflow: hidden;
          text-overflow: ellipsis;
          white-space: nowrap;
        }

        .messages {
          padding: 15px;
        }

        .message {
          max-width: 82%;
        }

        .chat-input {
          padding: 10px;
        }

        .header-actions {
          gap: 0;
        }

        .call-btn {
          width: 36px;
          font-size: 17px;
        }
      }

      /* WhatsApp-style chat upgrade */
      .chat-header {
        position: relative;
      }
      .header-actions {
        margin-left: auto;
        display: flex;
        gap: 5px;
      }
      .call-btn {
        width: 42px;
        height: 42px;
        border: 0;
        border-radius: 50%;
        background: transparent;
        color: #eee;
        font-size: 19px;
        cursor: pointer;
      }
      .call-btn:hover {
        background: rgba(255, 255, 255, 0.08);
      }
      .person-link {
        text-decoration: none;
        color: inherit;
        display: flex;
        align-items: center;
        gap: 14px;
        flex: 1;
        min-width: 0;
      }
      .person-link .user-info {
        min-width: 0;
      }
      .attach-wrap {
        position: relative;
      }
      .attach-menu {
        position: absolute;
        bottom: 58px;
        left: 0;
        background: #211d2c;
        border: 1px solid rgba(255, 255, 255, 0.1);
        border-radius: 14px;
        padding: 7px;
        display: none;
        z-index: 20;
        box-shadow: 0 15px 40px rgba(0, 0, 0, 0.45);
      }
      .attach-menu.open {
        display: block;
      }
      .attach-option {
        display: block;
        width: 190px;
        padding: 11px;
        border: 0;
        background: transparent;
        color: #fff;
        text-align: left;
        border-radius: 9px;
        cursor: pointer;
      }
      .attach-option:hover {
        background: rgba(255, 255, 255, 0.07);
      }
      .file-input {
        display: none;
      }
      .attach-preview {
        max-width: 320px;
        max-height: 320px;
        border-radius: 10px;
        display: block;
        margin-bottom: 5px;
      }
      .file-card {
        display: flex;
        align-items: center;
        gap: 9px;
        padding: 10px;
        border-radius: 10px;
        background: rgba(0, 0, 0, 0.16);
        min-width: 220px;
      }
      .file-card a {
        color: #fff;
        text-decoration: none;
        margin-left: auto;
      }
      /* WhatsApp-style video call */
      .call-overlay {
        position: fixed;
        inset: 0;
        background: #000;
        display: none;
        z-index: 100000;
        flex-direction: column;
        overflow: hidden;
      }
      .call-overlay.open { display: flex; }

      .call-top {
        position: absolute;
        top: 0;
        left: 0;
        right: 0;
        z-index: 5;
        padding: 22px 24px 42px;
        text-align: center;
        color: #fff;
        background: linear-gradient(to bottom, rgba(0,0,0,.72), rgba(0,0,0,0));
        pointer-events: none;
      }
      .call-top h3 {
        margin: 0;
        font-size: 17px;
        font-weight: 600;
        letter-spacing: .1px;
        text-shadow: 0 1px 3px rgba(0,0,0,.5);
      }
      .call-status {
        font-size: 12px;
        color: rgba(255,255,255,.78);
        margin-top: 4px;
      }

      .video-stage {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        display: flex;
        align-items: center;
        justify-content: center;
        background: #000;
        overflow: hidden;
      }

      /* Keep the COMPLETE camera frame visible. No crop/zoom. */
      #remoteVideo {
        display: block;
        width: 100%;
        height: 100%;
        max-width: none;
        max-height: none;
        aspect-ratio: auto;
        object-fit: cover;
        object-position: center center;
        background: #000;
        border-radius: 0;
      }

      /* WhatsApp-style floating self preview */
      #localVideo {
        position: absolute;
        top: 76px;
        right: 18px;
        width: clamp(118px, 19vw, 200px);
        height: clamp(158px, 25vw, 266px);
        aspect-ratio: 3 / 4;
        object-fit: cover;
        object-position: center center;
        transform: scaleX(-1);
        background: #111;
        border-radius: 12px;
        border: 2px solid rgba(255,255,255,.88);
        box-shadow: 0 5px 20px rgba(0,0,0,.45);
        z-index: 6;
      }

      .call-controls {
        position: absolute;
        left: 0;
        right: 0;
        bottom: 0;
        z-index: 7;
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 18px;
        padding: 26px 18px calc(28px + env(safe-area-inset-bottom));
        background: linear-gradient(to top, rgba(0,0,0,.8), rgba(0,0,0,0));
      }
      .call-control {
        width: 56px;
        height: 56px;
        flex: 0 0 56px;
        border: 0;
        border-radius: 50%;
        background: rgba(42,42,42,.92);
        color: #fff;
        font-size: 21px;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        cursor: pointer;
        box-shadow: 0 4px 14px rgba(0,0,0,.35);
        -webkit-tap-highlight-color: transparent;
      }
      .call-control.end {
        background: #e53935;
        width: 62px;
        height: 62px;
        flex-basis: 62px;
        font-size: 22px;
      }
      .call-control:active { transform: scale(.94); }

      .messages {
        transition: background 0.25s ease;
      }
      .messages .message {
        -webkit-touch-callout: none;
        -webkit-user-select: none;
        user-select: none;
        transition:
          transform 0.15s ease,
          filter 0.15s ease;
      }
      .messages .message.pressing {
        transform: scale(0.97);
        filter: brightness(1.15);
      }
      .message-row.selected .message {
        outline: 2px solid rgba(255, 255, 255, 0.5);
        outline-offset: 2px;
      }
      .message-row.removing {
        animation: msgOut 0.22s ease forwards;
      }
      @keyframes msgOut {
        to {
          opacity: 0;
          transform: scale(0.9);
          height: 0;
          margin: 0;
        }
      }
      .msg-menu {
        position: fixed;
        z-index: 200;
        min-width: 200px;
        background: #1e1a2b;
        border: 1px solid rgba(255, 255, 255, 0.12);
        border-radius: 14px;
        padding: 6px;
        box-shadow: 0 18px 50px rgba(0, 0, 0, 0.55);
        display: none;
        flex-direction: column;
      }
      .msg-menu.open {
        display: flex;
        animation: menuIn 0.12s ease;
      }
      @keyframes menuIn {
        from {
          opacity: 0;
          transform: scale(0.95);
        }
        to {
          opacity: 1;
          transform: scale(1);
        }
      }
      .msg-menu button {
        display: flex;
        align-items: center;
        gap: 10px;
        width: 100%;
        background: none;
        border: 0;
        color: #eee;
        font-size: 14px;
        padding: 11px 12px;
        border-radius: 9px;
        cursor: pointer;
        text-align: left;
      }
      .msg-menu button:hover,
      .msg-menu button:focus-visible {
        background: rgba(255, 255, 255, 0.08);
        outline: none;
      }
      .msg-menu button.danger {
        color: #ff6b8f;
      }
      .msg-menu button[hidden] {
        display: none;
      }
      .bg-modal {
        position: fixed;
        inset: 0;
        z-index: 210;
        display: none;
        align-items: center;
        justify-content: center;
        background: rgba(5, 3, 12, 0.7);
        backdrop-filter: blur(8px);
        padding: 16px;
      }
      .bg-modal.open {
        display: flex;
      }
      .bg-card {
        width: min(440px, 100%);
        background: #171322;
        border: 1px solid rgba(255, 255, 255, 0.12);
        border-radius: 20px;
        padding: 20px;
        box-shadow: 0 25px 80px rgba(0, 0, 0, 0.55);
      }
      .bg-card-head {
        display: flex;
        align-items: center;
        justify-content: space-between;
        margin-bottom: 4px;
      }
      .bg-card h3 {
        font-size: 18px;
        color: #fff;
      }
      .bg-card p {
        font-size: 13px;
        color: #a9a3b8;
        margin-bottom: 16px;
      }
      .bg-close {
        background: none;
        border: 0;
        color: #bbb;
        font-size: 22px;
        cursor: pointer;
        width: 34px;
        height: 34px;
        border-radius: 50%;
      }
      .bg-close:hover {
        background: rgba(255, 255, 255, 0.08);
      }
      .bg-grid {
        display: grid;
        grid-template-columns: repeat(4, 1fr);
        gap: 10px;
        margin-bottom: 16px;
      }
      .bg-swatch {
        aspect-ratio: 3/4;
        border-radius: 12px;
        border: 2px solid rgba(255, 255, 255, 0.1);
        cursor: pointer;
        position: relative;
        overflow: hidden;
        background-color: #14111c;
      }
      .bg-swatch span {
        position: absolute;
        left: 0;
        right: 0;
        bottom: 0;
        font-size: 11px;
        color: #fff;
        padding: 4px;
        background: rgba(0, 0, 0, 0.45);
        text-align: center;
      }
      .bg-swatch.active {
        border-color: #ff3f8e;
        box-shadow: 0 0 0 3px rgba(255, 63, 142, 0.25);
      }
      .bg-actions {
        display: flex;
        gap: 10px;
      }
      .bg-actions button {
        flex: 1;
        border: 0;
        border-radius: 12px;
        padding: 12px;
        font-weight: 700;
        font-size: 14px;
        cursor: pointer;
        color: #fff;
      }
      .bg-upload {
        background: linear-gradient(135deg, #ff3f8e, #a855f7);
      }
      .bg-remove {
        background: #2a2533;
      }
      .bg-actions button:disabled {
        opacity: 0.6;
        cursor: wait;
      }
      @media (max-width: 600px) {
        .bg-grid {
          grid-template-columns: repeat(3, 1fr);
        }
        .msg-menu {
          min-width: 180px;
        }
      }
      @media (max-width: 600px) {
        .call-btn {
          width: 36px;
        }
        .attach-preview {
          max-width: 240px;
        }
        .file-card {
          min-width: 0;
          width: min(100%, 280px);
        }
        .attach-option {
          width: min(190px, calc(100vw - 32px));
        }
        .call-top {
          padding-top: 18px;
          padding-bottom: 38px;
        }
        #localVideo {
          top: 68px;
          right: 12px;
          width: 108px;
          height: 144px;
          border-radius: 10px;
        }
        .call-controls {
          gap: 14px;
          padding-bottom: calc(20px + env(safe-area-inset-bottom));
        }
        .call-control {
          width: 52px;
          height: 52px;
          flex-basis: 52px;
        }
        .call-control.end {
          width: 58px;
          height: 58px;
          flex-basis: 58px;
        }
      }
    </style>
    <link rel="stylesheet" href="css/animated-ui.css">
  <link rel="stylesheet" href="css/responsive.css">
</head>

  <body>
    <!-- =========================
         NAVBAR
    ========================= -->

    <nav>
      <div class="logo">❤️ HeartMatch</div>

      <div class="nav-links">
        <a href="discover.html"> Discover </a>

        <a href="matches.html"> Matches </a>

        <a href="profile.html"> Profile </a>
      </div>
    </nav>

    <!-- =========================
         CHAT
    ========================= -->

    <div class="chat-container">
      <!-- HEADER -->

      <div class="chat-header">
        <a href="matches.html" class="back">←</a>

        <a class="person-link" id="personLink" href="#">
          <div class="profile-photo" id="profilePhoto">❤️</div>
          <div class="user-info">
            <h2 id="userName">Loading...</h2>
            <div class="online-status" id="onlineStatus">
              <span class="status-dot"></span>
              <span id="statusText">Checking status...</span>
            </div>
          </div>
        </a>

        <div class="header-actions">
          <button
            class="call-btn"
            id="backgroundBtn"
            type="button"
            title="Chat background"
            aria-label="Change chat background"
          >
            🎨
          </button>
          <button
            class="call-btn"
            id="videoCallBtn"
            type="button"
            title="Video call"
          >
            📹
          </button>
          <button
            class="call-btn"
            id="audioCallBtn"
            type="button"
            title="Audio call"
          >
            📞
          </button>
        </div>
      </div>

      <!-- MESSAGES -->

      <div class="messages" id="messages">
        <div class="loading">Loading conversation...</div>
      </div>

      <!-- TYPING -->

      <div class="typing" id="typing">
        <span class="typing-dots" id="typingDots">
          <span></span>
          <span></span>
          <span></span>
        </span>

        <span id="typingText"></span>
      </div>

      <!-- INPUT -->

      <form class="chat-input" id="chatForm" style="position: relative">
        <div class="attach-wrap">
          <button type="button" class="call-btn" id="attachBtn" title="Attach">
            📎
          </button>
          <div class="attach-menu" id="attachMenu">
            <button type="button" class="attach-option" id="photoOption">
              🖼️ Photos & videos
            </button>
            <button type="button" class="attach-option" id="fileOption">
              📎 Document
            </button>
          </div>
          <input class="file-input" id="fileInput" type="file" />
        </div>

        <input
          type="text"
          id="messageInput"
          placeholder="Type a message..."
          maxlength="2000"
          autocomplete="off"
        />

        <button class="send-btn" id="sendBtn" type="submit">➤</button>
      </form>
    </div>

    <style>
      .incoming-call-modal {
        position: fixed;
        inset: 0;
        z-index: 99999;
        display: none;
        align-items: center;
        justify-content: center;
        background: rgba(5, 3, 12, 0.72);
        backdrop-filter: blur(12px);
        padding: 20px;
      }
      .incoming-call-modal.open {
        display: flex;
      }
      .incoming-call-card {
        width: min(380px, 100%);
        background: #171322;
        border: 1px solid rgba(255, 255, 255, 0.12);
        border-radius: 24px;
        padding: 28px;
        text-align: center;
        box-shadow: 0 25px 80px rgba(0, 0, 0, 0.55);
      }
      .incoming-call-avatar {
        width: 78px;

      .incoming-call-title {

        margin-bottom: 24px;

      .incoming-call-actions {

      .incoming-call-actions button {

        border: 0;

      }
    </style>

    <div class="msg-menu" id="msgMenu" role="menu" aria-label="Message options">
      <button type="button" role="menuitem" data-action="copy">
        📋 Copy text
      </button>
      <button type="button" role="menuitem" data-action="unsend" class="danger">
        ↩️ Unsend
      </button>
      <button type="button" role="menuitem" data-action="background">
        🎨 Chat background
      </button>
    </div>

    <div
      class="bg-modal"
      id="bgModal"
      role="dialog"
      aria-modal="true"
      aria-labelledby="bgModalTitle"
    >
      <div class="bg-card">
        <div class="bg-card-head">
          <h3 id="bgModalTitle">Chat background</h3>
          <button
            type="button"
            class="bg-close"
            id="bgClose"
            aria-label="Close"
          >
            ×
          </button>
        </div>
        <p>Only you see this background, in this chat.</p>
        <div class="bg-grid" id="bgGrid"></div>
        <div class="bg-actions">
          <button type="button" class="bg-upload" id="bgUpload">
            Upload photo
          </button>
          <button type="button" class="bg-remove" id="bgRemove">Reset</button>
        </div>
        <input type="file" id="bgFileInput" accept="image/*" hidden />
      </div>
    </div>

    <div class="call-overlay" id="callOverlay">
      <div class="call-top">
        <h3 id="callTitle">Video call</h3>
        <div class="call-status" id="callStatus">Connecting...</div>
      </div>
      <div class="video-stage">
        <video id="remoteVideo" autoplay playsinline></video
        ><video id="localVideo" autoplay muted playsinline></video>
      </div>
      <div class="call-controls">
        <button class="call-control" id="muteBtn" type="button">🎙️</button
        ><button class="call-control" id="cameraBtn" type="button">📷</button
        ><button class="call-control end" id="endCallBtn" type="button">
          ☎
        </button>
      </div>
    </div>

    <div
      class="incoming-call-modal"
      id="incomingCallModal"
      role="dialog"
      aria-modal="true"
    >
      <div class="incoming-call-card">
        <img
          id="incomingCallAvatar"
          class="incoming-call-avatar"
          alt="Caller"
        />
        <div class="incoming-call-title" id="incomingCallTitle">
          Incoming call
        </div>
        <div class="incoming-call-sub" id="incomingCallSubtitle">
          Someone is calling you
        </div>
        <div class="incoming-call-actions">
          <button class="incoming-decline" id="incomingDecline" type="button">
            ❌ Decline
          </button>
          <button class="incoming-accept" id="incomingAccept" type="button">
            ✅ Accept
          </button>
        </div>
      </div>
    </div>

    <script>
      // =========================
      // BASIC VARIABLES
      // =========================

      const API = "/api";

      const token = localStorage.getItem("token");

      const params = new URLSearchParams(window.location.search);

      let otherUserId = params.get("user");

      // =========================
      // LOGIN CHECK
      // =========================

      if (!token) {
        window.location.href = "login.html";
      }

      if (!otherUserId) {
        alert("No chat user selected.");

        window.location.href = "matches.html";
      }

      // =========================
      // ELEMENTS
      // =========================

      const messagesContainer = document.getElementById("messages");

      const messageInput = document.getElementById("messageInput");

      const chatForm = document.getElementById("chatForm");

      const sendBtn = document.getElementById("sendBtn");

      const personLink = document.getElementById("personLink");
      const attachBtn = document.getElementById("attachBtn");
      const attachMenu = document.getElementById("attachMenu");
      const fileInput = document.getElementById("fileInput");
      const videoCallBtn = document.getElementById("videoCallBtn");
      const audioCallBtn = document.getElementById("audioCallBtn");
      const callOverlay = document.getElementById("callOverlay");
      const callTitle = document.getElementById("callTitle");
      const callStatus = document.getElementById("callStatus");
      const remoteVideo = document.getElementById("remoteVideo");
      const localVideo = document.getElementById("localVideo");
      const muteBtn = document.getElementById("muteBtn");
      const cameraBtn = document.getElementById("cameraBtn");
      const endCallBtn = document.getElementById("endCallBtn");
      const userName = document.getElementById("userName");

      const profilePhoto = document.getElementById("profilePhoto");

      const onlineStatus = document.getElementById("onlineStatus");

      const statusText = document.getElementById("statusText");

      const typingIndicator = document.getElementById("typing");

      const typingText = document.getElementById("typingText");

      let currentUserId = null;

      let socket = null;

      let typingTimeout = null;

      let chatUserName = "They";

      // =========================
      // ESCAPE HTML
      // =========================

      function escapeHTML(value) {
        const div = document.createElement("div");

        div.textContent = value;

        return div.innerHTML;
      }

      // =========================
      // GET CURRENT USER
      // =========================

      function getCurrentUser() {
        try {
          const user = JSON.parse(localStorage.getItem("user"));

          if (user && user.id) {
            currentUserId = user.id.toString();
          }
        } catch (error) {
          console.error(error);
        }
      }

      // =========================
      // UPDATE ONLINE STATUS
      // =========================

      function updateOnlineStatus(isOnline) {
        if (isOnline) {
          onlineStatus?.classList.remove("offline");

          onlineStatus?.classList.add("online");

          statusText.textContent = "Online";
        } else {
          onlineStatus?.classList.remove("online");

          onlineStatus?.classList.add("offline");

          statusText.textContent = "Offline";
        }
      }

      // =========================
      // LOAD CHAT
      // =========================

      async function loadChat() {
        try {
          if (!messagesContainer || !userName || !profilePhoto) {
            throw new Error(
              "Chat UI elements are missing. Please hard-refresh the page (Ctrl+Shift+R).",
            );
          }

          const response = await fetch(`${API}/chat/${otherUserId}`, {
            headers: {
              Authorization: `Bearer ${token}`,
            },
          });

          const data = await response.json();

          if (!response.ok) {
            throw new Error(data.message || "Failed to load chat");
          }

          // =========================
          // USER INFORMATION
          // =========================

          // Convert a public HeartMatch User ID from the URL to the
          // MongoDB _id used by Socket.IO message/call events.
          if (data.user?._id) {
            otherUserId = data.user._id.toString();
          }

          userName.textContent = `${data.user.name}, ${data.user.age}`;

          if (personLink)
            personLink.href = `person.html?user=${encodeURIComponent(otherUserId)}`;

          chatUserName = data.user.name || "They";

          if (data.user.profileImage) {
            profilePhoto.innerHTML = `<img
                            src="${escapeHTML(data.user.profileImage)}"
                            alt="Profile"
                        >`;

            const chatProfileImg = profilePhoto.querySelector("img");
            chatProfileImg?.addEventListener("error", () => {
              profilePhoto.innerHTML = escapeHTML((data.user.name || "?").charAt(0).toUpperCase());
              profilePhoto.title = "Profile photo unavailable";
              profilePhoto.onclick = null;
            }, { once: true });

            profilePhoto.title = "Open profile photo";
            profilePhoto.onclick = (event) => {
              event.preventDefault();
              event.stopPropagation();
              window.open(
                data.user.profileImage,
                "_blank",
                "noopener,noreferrer",
              );
            };
          } else {
            profilePhoto.textContent = data.user.name.charAt(0).toUpperCase();

            profilePhoto.title = "";
            profilePhoto.onclick = null;
          }

          // Don't assume online here.
          // Socket.IO will determine status.

          updateOnlineStatus(false);

          applyChatBackground(data.background || "");

          // =========================
          // MESSAGES
          // =========================

          messagesContainer.innerHTML = "";

          if (!data.messages.length) {
            messagesContainer.innerHTML = `

                        <div class="empty-chat">

                            <div class="heart">
                                💕
                            </div>

                            <p>
                                Start your conversation!
                            </p>

                        </div>

                    `;

            return;
          }

          data.messages.forEach((message) => {
            displayMessage(message);
          });

          scrollToBottom();
        } catch (error) {
          console.error(error);

          messagesContainer.innerHTML = `

                    <div class="empty-chat">

                        <div class="heart">
                            😕
                        </div>

                        <p>
                            ${escapeHTML(error.message)}
                        </p>

                    </div>

                `;
        }
      }

      // =========================
      // DISPLAY MESSAGE
      // =========================

      function displayMessage(message) {
        if (
          message._id &&
          messagesContainer.querySelector(`[data-message-id="${message._id}"]`)
        )
          return;
        messagesContainer.querySelector(".empty-chat")?.remove();
        const isMine = message.sender.toString() === currentUserId;
        const row = document.createElement("div");
        row.className = `message-row ${isMine ? "mine" : ""}`;
        if (message._id) row.dataset.messageId = message._id;
        row.dataset.mine = isMine ? "1" : "0";
        const bubble = document.createElement("div");
        bubble.className = "message";
        let attachment = null;
        try {
          if (
            typeof message.content === "string" &&
            message.content.startsWith("__HM_ATTACHMENT__")
          ) {
            attachment = JSON.parse(message.content.slice(17));
          }
        } catch (e) {}
        if (attachment) {
          if (attachment.kind === "image") {
            const img = document.createElement("img");
            img.className = "attach-preview";
            img.src = attachment.data;
            img.alt = attachment.name || "Shared image";
            img.onclick = () => window.open(attachment.data, "_blank");
            bubble.appendChild(img);
          } else if (attachment.kind === "video") {
            const video = document.createElement("video");
            video.className = "attach-preview";
            video.src = attachment.data;
            video.controls = true;
            bubble.appendChild(video);
          } else {
            const card = document.createElement("div");
            card.className = "file-card";
            card.innerHTML = `<span>📄</span><div><b>${escapeHTML(attachment.name)}</b><small style="display:block;opacity:.6">${escapeHTML(attachment.type || "Attachment")}</small></div><a href="${attachment.data}" download="${escapeHTML(attachment.name)}">⬇</a>`;
            bubble.appendChild(card);
          }
        } else {
          const content = document.createElement("div");
          content.textContent = message.content;
          bubble.appendChild(content);
          row.dataset.text = message.content;
        }
        const time = document.createElement("div");
        time.className = "message-time";
        time.textContent = formatTime(message.createdAt);
        bubble.appendChild(time);
        row.appendChild(bubble);
        messagesContainer.appendChild(row);
      }

      // =========================
      // FORMAT TIME
      // =========================

      function formatTime(date) {
        if (!date) return "";

        return new Date(date).toLocaleTimeString([], {
          hour: "2-digit",

          minute: "2-digit",
        });
      }

      // =========================
      // SCROLL
      // =========================

      function scrollToBottom() {
        messagesContainer.scrollTop = messagesContainer.scrollHeight;
      }

      // =========================
      // SOCKET CONNECTION
      // =========================

      socket = io({
        auth: {
          token: token,
        },
      });

      // =========================
      // SOCKET CONNECTED
      // =========================

      socket.on("connect", () => {
        console.log("Socket connected ❤️");

        /*
                    Ask server whether the
                    person we're chatting with
                    is currently online.
                */

        socket.emit(
          "checkUserOnline",
          {
            userId: otherUserId,
          },
          (response) => {
            if (response && response.success) {
              updateOnlineStatus(response.online);
            }
          },
        );
      });

      // =========================
      // SOCKET ERROR
      // =========================

      socket.on("disconnect", () => {
        clearTimeout(typingTimeout);

        typingIndicator?.classList.remove("active");

        typingText.textContent = "";
      });

      socket.on("connect_error", (error) => {
        console.error("Socket error:", error.message);

        updateOnlineStatus(false);
      });

      // =========================
      // USER ONLINE
      // =========================

      socket.on("userOnline", (userId) => {
        if (userId.toString() === otherUserId.toString()) {
          updateOnlineStatus(true);
        }
      });

      // =========================
      // USER OFFLINE
      // =========================

      socket.on("userOffline", (userId) => {
        if (userId.toString() === otherUserId.toString()) {
          updateOnlineStatus(false);
        }
      });

      // =========================
      // USER TYPING
      // =========================

      socket.on("userTyping", (data) => {
        if (
          data &&
          data.userId &&
          data.userId.toString() === otherUserId.toString()
        ) {
          typingText.textContent = `${chatUserName} is typing...`;

          typingIndicator?.classList.add("active");
        }
      });

      // =========================
      // USER STOPPED TYPING
      // =========================

      socket.on("userStoppedTyping", (data) => {
        if (
          data &&
          data.userId &&
          data.userId.toString() === otherUserId.toString()
        ) {
          typingIndicator?.classList.remove("active");

          typingText.textContent = "";
        }
      });

      // =========================
      // MESSAGE SENT
      // =========================

      socket.on("messageSent", (message) => {
        displayMessage(message);

        scrollToBottom();
      });

      // =========================
      // NEW MESSAGE
      // =========================

      socket.on("newMessage", (message) => {
        if (message.sender.toString() === otherUserId.toString()) {
          displayMessage(message);

          scrollToBottom();
        }
      });

      // =========================
      // TYPING DETECTION
      // =========================

      messageInput?.addEventListener("input", function () {
        if (!socket || !socket.connected || !otherUserId) {
          return;
        }

        const content = messageInput.value.trim();

        clearTimeout(typingTimeout);

        if (!content) {
          socket.emit("stopTyping", {
            receiver: otherUserId,
          });

          return;
        }

        socket.emit("typing", {
          receiver: otherUserId,
        });

        typingTimeout = setTimeout(function () {
          socket.emit("stopTyping", {
            receiver: otherUserId,
          });
        }, 1000);
      });

      // =========================
      // SEND MESSAGE
      // =========================

      chatForm?.addEventListener("submit", function (event) {
        event.preventDefault();

        const content = messageInput.value.trim();

        clearTimeout(typingTimeout);

        socket.emit("stopTyping", {
          receiver: otherUserId,
        });

        typingIndicator?.classList.remove("active");

        typingText.textContent = "";

        if (!content) {
          return;
        }

        sendBtn.disabled = true;

        socket.emit(
          "sendMessage",
          {
            receiver: otherUserId,

            content: content,
          },

          function (response) {
            sendBtn.disabled = false;

            if (!response || !response.success) {
              alert(response?.message || "Failed to send message");

              return;
            }

            messageInput.value = "";

            messageInput.focus();
          },
        );
      });

      // =========================
      // ENTER = SEND
      // =========================

      messageInput?.addEventListener("keydown", function (event) {
        if (event.key === "Enter" && !event.shiftKey) {
          event.preventDefault();

          chatForm.requestSubmit();
        }
      });

      // =========================
      // ATTACHMENTS
      // =========================
      attachBtn?.addEventListener("click", () =>
        attachMenu?.classList.toggle("open"),
      );
      document.getElementById("photoOption")?.addEventListener("click", () => {
        fileInput.accept = "image/*,video/*";
        fileInput.click();
        attachMenu?.classList.remove("open");
      });
      document.getElementById("fileOption")?.addEventListener("click", () => {
        fileInput.accept = ".pdf,.doc,.docx,.txt,.zip,.ppt,.pptx,.xls,.xlsx";
        fileInput.click();
        attachMenu?.classList.remove("open");
      });
      fileInput?.addEventListener("change", () => {
        const file = fileInput.files && fileInput.files[0];
        if (!file) return;
        const max =
          file.type.startsWith("image/") || file.type.startsWith("video/")
            ? 3 * 1024 * 1024
            : 2 * 1024 * 1024;
        if (file.size > max) {
          alert(
            `File is too large. Maximum ${Math.round(max / 1024 / 1024)} MB.`,
          );
          fileInput.value = "";
          return;
        }
        const reader = new FileReader();
        reader.onload = () => {
          const kind = file.type.startsWith("image/")
            ? "image"
            : file.type.startsWith("video/")
              ? "video"
              : "file";
          socket.emit(
            "sendAttachment",
            {
              receiver: otherUserId,
              attachment: {
                kind,
                name: file.name,
                type: file.type,
                data: reader.result,
              },
            },
            (response) => {
              if (!response || !response.success)
                alert(response?.message || "Failed to send attachment");
              fileInput.value = "";
            },
          );
        };
        reader.readAsDataURL(file);
      });
      document.addEventListener("click", (e) => {
        if (!attachMenu?.contains(e.target) && e.target !== attachBtn)
          attachMenu?.classList.remove("open");
      });

      // =========================
      // MESSAGE MENU (right click / long press)
      // =========================
      const msgMenu = document.getElementById("msgMenu");
      const menuCopy = msgMenu.querySelector('[data-action="copy"]');
      const menuUnsend = msgMenu.querySelector('[data-action="unsend"]');
      let menuTargetRow = null;
      let longPressTimer = null;
      let longPressStart = null;
      let lastLongPressAt = 0;
      const LONG_PRESS_MS = 480;

      function openMessageMenu(row, x, y) {
        closeMessageMenu();
        menuTargetRow = row;
        const hasId = !!row?.dataset.messageId;
        menuUnsend.hidden = !(row && hasId && row.dataset.mine === "1");
        menuCopy.hidden = !(row && row.dataset.text);
        row?.classList.add("selected");
        msgMenu.classList.add("open");
        const rect = msgMenu.getBoundingClientRect();
        const left = Math.min(
          Math.max(8, x),
          window.innerWidth - rect.width - 8,
        );
        const top = Math.min(
          Math.max(8, y),
          window.innerHeight - rect.height - 8,
        );
        msgMenu.style.left = `${left}px`;
        msgMenu.style.top = `${top}px`;
        msgMenu
          .querySelector("button:not([hidden])")
          ?.focus({ preventScroll: true });
      }

      function closeMessageMenu() {
        msgMenu.classList.remove("open");
        menuTargetRow?.classList.remove("selected");
        menuTargetRow = null;
      }

      function cancelLongPress() {
        clearTimeout(longPressTimer);
        longPressTimer = null;
        messagesContainer
          .querySelector(".message.pressing")
          ?.classList.remove("pressing");
      }

      messagesContainer.addEventListener("contextmenu", (event) => {
        event.preventDefault();
        // Android fires contextmenu after our own long-press already opened the menu.
        if (Date.now() - lastLongPressAt < 800) return;
        const row = event.target.closest(".message-row");
        openMessageMenu(row, event.clientX, event.clientY);
      });

      messagesContainer.addEventListener(
        "touchstart",
        (event) => {
          const bubble = event.target.closest(".message");
          if (!bubble || event.touches.length > 1) return;
          const touch = event.touches[0];
          longPressStart = { x: touch.clientX, y: touch.clientY };
          bubble.classList.add("pressing");
          longPressTimer = setTimeout(() => {
            bubble.classList.remove("pressing");
            lastLongPressAt = Date.now();
            navigator.vibrate?.(15);
            openMessageMenu(
              bubble.closest(".message-row"),
              longPressStart.x,
              longPressStart.y,
            );
          }, LONG_PRESS_MS);
        },
        { passive: true },
      );

      messagesContainer.addEventListener(
        "touchmove",
        (event) => {
          if (!longPressTimer || !longPressStart) return;
          const touch = event.touches[0];
          if (
            Math.hypot(
              touch.clientX - longPressStart.x,
              touch.clientY - longPressStart.y,
            ) > 10
          )
            cancelLongPress();
        },
        { passive: true },
      );

      messagesContainer.addEventListener("touchend", (event) => {
        cancelLongPress();
        if (Date.now() - lastLongPressAt < 600) event.preventDefault();
      });
      messagesContainer.addEventListener("touchcancel", cancelLongPress);
      messagesContainer.addEventListener("scroll", closeMessageMenu, {
        passive: true,
      });

      document.addEventListener("pointerdown", (event) => {
        if (
          msgMenu.classList.contains("open") &&
          !msgMenu.contains(event.target)
        )
          closeMessageMenu();
      });
      document.addEventListener("keydown", (event) => {
        if (event.key !== "Escape") return;
        closeMessageMenu();
        closeBackgroundPicker();
      });
      window.addEventListener("resize", closeMessageMenu);

      msgMenu.addEventListener("click", async (event) => {
        const action = event.target.closest("button")?.dataset.action;
        const row = menuTargetRow;
        closeMessageMenu();
        if (action === "copy" && row?.dataset.text) {
          try {
            await navigator.clipboard.writeText(row.dataset.text);
          } catch (e) {
            console.error(e);
          }
        } else if (action === "unsend" && row) {
          unsendMessage(row);
        } else if (action === "background") {
          openBackgroundPicker();
        }
      });

      function unsendMessage(row) {
        const messageId = row.dataset.messageId;
        if (
          !messageId ||
          !confirm("Unsend this message? It will be removed for everyone.")
        )
          return;
        socket.emit("unsendMessage", { messageId }, (response) => {
          if (!response || !response.success) {
            alert(response?.message || "Failed to unsend message");
            return;
          }
          removeMessageRow(messageId);
        });
      }

      function removeMessageRow(messageId) {
        const row = messagesContainer.querySelector(
          `[data-message-id="${messageId}"]`,
        );
        if (!row || row.classList.contains("removing")) return;
        row.classList.add("removing");
        setTimeout(() => {
          row.remove();
          if (!messagesContainer.querySelector(".message-row")) {
            messagesContainer.innerHTML = `<div class="empty-chat"><div class="heart">💕</div><p>Start your conversation!</p></div>`;
          }
        }, 220);
      }

      socket.on("messageUnsent", (data) => {
        if (!data?.messageId) return;
        const inThisChat =
          data.sender === otherUserId || data.receiver === otherUserId;
        if (inThisChat) removeMessageRow(data.messageId);
      });

      // =========================
      // CHAT BACKGROUND
      // =========================
      const BACKGROUND_PRESETS = {
        midnight: {
          label: "Midnight",
          css: "linear-gradient(160deg,#0f1026 0%,#1b1340 100%)",
        },
        rose: {
          label: "Rose",
          css: "radial-gradient(circle at 20% 15%,rgba(255,63,142,.35),transparent 45%),radial-gradient(circle at 85% 85%,rgba(168,85,247,.35),transparent 50%),#140f1d",
        },
        sunset: {
          label: "Sunset",
          css: "linear-gradient(165deg,#3a1030 0%,#5a1f2a 55%,#2b1433 100%)",
        },
        ocean: {
          label: "Ocean",
          css: "linear-gradient(165deg,#07192a 0%,#0e3345 60%,#0a1d2c 100%)",
        },
        forest: {
          label: "Forest",
          css: "linear-gradient(165deg,#0b1d15 0%,#173326 60%,#0e1f18 100%)",
        },
        dots: {
          label: "Dots",
          css: "radial-gradient(rgba(255,63,142,.22) 1.2px,transparent 1.6px) 0 0/22px 22px,#15121f",
        },
        grid: {
          label: "Grid",

        },

      function backgroundToCss(value) {

        if (value.startsWith("data:image/")) {
          return `linear-gradient(rgba(12,10,20,.55),rgba(12,10,20,.55)),url("${value}") center/cover no-repeat`;
        }

        bgGrid.querySelectorAll(".bg-swatch").forEach((el) => {
          el.classList.toggle("active", el.dataset.value === currentBackground);
          el.setAttribute(
            "aria-pressed",
            el.dataset.value === currentBackground ? "true" : "false",
          );
        });
      }

      Object.entries(BACKGROUND_PRESETS).forEach(([key, preset]) => {
        const swatch = document.createElement("button");
        swatch.type = "button";
        swatch.className = "bg-swatch";
        swatch.dataset.value = `preset:${key}`;
        swatch.style.background = preset.css;
        swatch.setAttribute("aria-label", `${preset.label} background`);
        swatch.innerHTML = `<span>${preset.label}</span>`;
        swatch.addEventListener("click", () =>

        );

      async function saveChatBackground(value) {
        const previous = currentBackground;
        applyChatBackground(value);
        bgUpload.disabled = bgRemove.disabled = true;
        try {
          const response = await fetch(
            `${API}/chat/${otherUserId}/background`,
            {
              method: "PUT",
              headers: {
                "Content-Type": "application/json",
                Authorization: `Bearer ${token}`,
              },
              body: JSON.stringify({ background: value }),
            },
          );
          const data = await response.json().catch(() => ({}));
          if (!response.ok)
            throw new Error(data.message || "Failed to save background");
        } catch (error) {
          applyChatBackground(previous);
          alert(error.message);
        } finally {
          bgUpload.disabled = bgRemove.disabled = false;
        }
      }

      function compressImage(file) {
        return new Promise((resolve, reject) => {
          const url = URL.createObjectURL(file);
          const img = new Image();
          img.onload = () => {
            URL.revokeObjectURL(url);
            const maxSide = 1280;
            const scale = Math.min(
              1,
              maxSide / Math.max(img.width, img.height),
            );
            const canvas = document.createElement("canvas");
            canvas.width = Math.round(img.width * scale);
            canvas.height = Math.round(img.height * scale);
            canvas
              .getContext("2d")
              .drawImage(img, 0, 0, canvas.width, canvas.height);
            let quality = 0.8;
            let dataUrl = canvas.toDataURL("image/jpeg", quality);
            while (dataUrl.length > 880000 && quality > 0.35) {
              quality -= 0.1;
              dataUrl = canvas.toDataURL("image/jpeg", quality);
            }
            if (dataUrl.length > 880000)
              return reject(
                new Error("Image is too large, try a smaller one."),
              );
            resolve(dataUrl);
          };
          img.onerror = () => {
            URL.revokeObjectURL(url);
            reject(new Error("Could not read that image."));
          };
          img.src = url;
        });
      }

        .getElementById("backgroundBtn")
        ?.addEventListener("click", openBackgroundPicker);

        try {

          await saveChatBackground(dataUrl);
          closeBackgroundPicker();
        } catch (error) {
          alert(error.message);
        }
      });

// --------------------------------------------------
// WEBRTC / TURN CONFIG

let rtcConfig = {
  iceServers: [
    { urls: "stun:stun.l.google.com:19302" },
    { urls: "stun:stun1.l.google.com:19302" },
  ],
};

async function loadWebRTCConfig() {
  try {
    const response = await fetch("/api/turn-config", {
      cache: "no-store",
    });

    if (!response.ok) {
      throw new Error("Failed to load WebRTC configuration");
    }

    const config = await response.json();

    if (
      config &&
      Array.isArray(config.iceServers) &&
      config.iceServers.length > 0
    ) {
      rtcConfig = {
        iceServers: config.iceServers,
      };
    }

    console.log("✅ WebRTC configuration loaded");
    console.log(
      "🧊 ICE server count:",
      rtcConfig.iceServers.length
    );
  } catch (error) {
    console.warn(
      "⚠️ TURN configuration unavailable. Using STUN only:",
      error
    );
  }
}


// --------------------------------------------------
// CALL UI
// --------------------------------------------------

const incomingCallModal =
  document.getElementById("incomingCallModal");

const incomingCallTitle =
  document.getElementById("incomingCallTitle");

const incomingCallSubtitle =
  document.getElementById("incomingCallSubtitle");

const incomingCallAvatar =
  document.getElementById("incomingCallAvatar");

const incomingAccept =
  document.getElementById("incomingAccept");

const incomingDecline =
  document.getElementById("incomingDecline");


// --------------------------------------------------
// CALL STATE
// --------------------------------------------------

let peer = null;
let localStream = null;
// Keeps one stable MediaStream for the remote video.
// WebRTC can fire ontrack multiple times (audio/video).
let remoteMediaStream = null;

let callTarget = null;
let callMode = "video";

let incomingCall = null;


// IMPORTANT:
// Candidates can arrive before the peer exists,
// or before the remote description is ready.
//
// Store them by sender ID instead of dropping them.
const pendingIceByPeer = new Map();


// Prevent old connection timers from affecting
// a new call.
let connectionTimer = null;


// --------------------------------------------------
// CALL UI HELPERS
// --------------------------------------------------

function openCall(
  mode,
  statusText = `Calling ${chatUserName}...`
) {
  callMode = mode;

  callOverlay?.classList.add("open");
  document.body.classList.add("call-open");

  if (callTitle) {
    callTitle.textContent =
      mode === "video"
        ? "Video call"
        : "Audio call";
  }

  if (callStatus) {
    callStatus.textContent = statusText;
  }
}


function closeCall() {
  callOverlay?.classList.remove("open");
  document.body.classList.remove("call-open");

 if (remoteVideo) {
  remoteVideo.srcObject = null;
  remoteVideo.onloadedmetadata = null;
}

remoteMediaStream = null;

  if (localVideo) {
    localVideo.srcObject = null;
  }

  if (callStatus) {
    callStatus.textContent = "";
  }
}


function hideIncomingCall() {
  incomingCall = null;

  incomingCallModal?.classList.remove("open");
}


// --------------------------------------------------
// ICE QUEUE HELPERS
// --------------------------------------------------

function queueIceCandidate(fromId, candidate) {
  if (!fromId || !candidate) return;

  const key = String(fromId);

  if (!pendingIceByPeer.has(key)) {
    pendingIceByPeer.set(key, []);
  }

  pendingIceByPeer.get(key).push(candidate);

  console.log(
    "🧊 ICE candidate queued for:",
    key,
    "queue size:",
    pendingIceByPeer.get(key).length
  );
}


async function flushIceCandidates(fromId) {
  if (!fromId || !peer) return;

  const key = String(fromId);

  const queue = pendingIceByPeer.get(key);

  if (!queue || queue.length === 0) {
    return;
  }

  if (!peer.remoteDescription) {
    console.log(
      "🧊 Remote description not ready. Keeping ICE queue."
    );
    return;
  }

  console.log(
    "🧊 Flushing queued ICE candidates:",
    queue.length
  );

  pendingIceByPeer.delete(key);

  for (const candidate of queue) {
    try {
      await peer.addIceCandidate(candidate);

      console.log(
        "✅ Queued ICE candidate added"
      );
    } catch (error) {
      console.warn(
        "⚠️ Queued ICE candidate failed:",
        error
      );
    }
  }
}


function clearIceQueue(fromId = null) {
  if (fromId) {
    pendingIceByPeer.delete(String(fromId));
  } else {
    pendingIceByPeer.clear();
  }
}


// --------------------------------------------------
// MEDIA
// --------------------------------------------------

async function getCallMedia(mode) {
  if (!navigator.mediaDevices?.getUserMedia) {
    throw new Error(
      "Camera/microphone requires HTTPS or localhost."
    );
  }

  return navigator.mediaDevices.getUserMedia({
    audio: true,
    video: mode === "video"
      ? {
          facingMode: { ideal: "user" },
          width: { ideal: 1280, min: 640 },
          height: { ideal: 720, min: 480 },
        }
      : false,
  });
}


// --------------------------------------------------
// CLEANUP
// --------------------------------------------------

async function cleanupCall(notify = true) {
  const target = callTarget;

  if (connectionTimer) {
    clearTimeout(connectionTimer);
    connectionTimer = null;
  }

  if (
    notify &&
    target &&
    socket?.connected
  ) {
    socket.emit("callEnd", {
      to: target,
    });
  }

  if (peer) {
    try {
      peer.ontrack = null;
      peer.onicecandidate = null;
      peer.oniceconnectionstatechange = null;
      peer.onconnectionstatechange = null;
      peer.close();
    } catch {}

    peer = null;
  }

  if (localStream) {
    localStream
      .getTracks()
      .forEach((track) => track.stop());

    localStream = null;
  }

  clearIceQueue();

  callTarget = null;

  hideIncomingCall();

  closeCall();
}


// --------------------------------------------------
// CREATE PEER CONNECTION
// --------------------------------------------------

function setupPeer(target) {
  peer = new RTCPeerConnection(rtcConfig);

  console.log(
    "🟢 RTCPeerConnection created"
  );

  console.log(
    "🧊 ICE servers:",
    rtcConfig.iceServers
  );


  // ----------------------------------------------
  // REMOTE TRACK
  // ----------------------------------------------

  // ----------------------------------------------
// REMOTE TRACK
// ----------------------------------------------

peer.ontrack = (event) => {
  console.log("🎥 REMOTE TRACK RECEIVED", event);

  if (!remoteVideo || !event.track) {
    console.warn("⚠️ Remote video element or track missing");
    return;
  }

  // Create ONE stable MediaStream.
  // Do not replace remoteVideo.srcObject every time
  // ontrack fires.
  if (!remoteMediaStream) {
    remoteMediaStream = new MediaStream();

    remoteVideo.srcObject = remoteMediaStream;

    console.log("🎥 Created remote MediaStream");
  }

  // Avoid adding the same track twice.
  const alreadyAdded =
    remoteMediaStream
      .getTracks()
      .some((track) => track.id === event.track.id);

  if (!alreadyAdded) {
    remoteMediaStream.addTrack(event.track);

    console.log(
      "🎥 Added remote track:",
      event.track.kind,
      event.track.id
    );
  }

  // Make sure the video element is configured correctly.
  remoteVideo.autoplay = true;
  remoteVideo.playsInline = true;

  // Only try to play when the browser has enough data.
  // AbortError here is harmless because it means another
  // media load/play request replaced the previous one.
  const tryPlayRemoteVideo = async () => {
    try {
      if (
        remoteVideo.paused &&
        remoteVideo.readyState >= 2
      ) {
        await remoteVideo.play();

        console.log(
          "▶️ Remote video playing"
        );
      }
    } catch (error) {
      if (error?.name === "AbortError") {
        console.log(
          "ℹ️ Remote video play interrupted by stream update"
        );
        return;
      }

      console.warn(
        "⚠️ Remote video play warning:",
        error
      );
    }
  };

  if (remoteVideo.readyState >= 2) {
    tryPlayRemoteVideo();
  } else {
    remoteVideo.onloadedmetadata =
      () => {
        tryPlayRemoteVideo();
      };
  }
};


  // ----------------------------------------------
  // LOCAL ICE CANDIDATES
  // ----------------------------------------------

  peer.onicecandidate = (event) => {
    if (!event.candidate) {
      console.log(
        "🧊 ICE candidate gathering finished"
      );
      return;
    }

    console.log(
      "🧊 Local ICE candidate:",
      event.candidate.candidate
    );

    if (
      socket?.connected &&
      target
    ) {
      socket.emit("callIce", {
        to: String(target),
        candidate: event.candidate,
      });
    }
  };


  // ----------------------------------------------
  // ICE GATHERING STATE
  // ----------------------------------------------

  peer.onicegatheringstatechange =
    () => {
      console.log(
        "🧊 ICE gathering state:",
        peer?.iceGatheringState
      );
    };


  // ----------------------------------------------
  // ICE CONNECTION STATE
  // ----------------------------------------------

  peer.oniceconnectionstatechange =
    () => {
      const state =
        peer?.iceConnectionState;

      console.log(
        "🧊 ICE connection state:",
        state
      );

      if (
        state === "connected" ||
        state === "completed"
      ) {
        console.log(
          "✅ ICE CONNECTION ESTABLISHED"
        );
      }

      if (state === "failed") {
        console.error(
          "❌ ICE CONNECTION FAILED"
        );

        if (callStatus) {
          callStatus.textContent =
            "Connection failed";
        }
      }

      if (state === "disconnected") {
        console.warn(
          "⚠️ ICE temporarily disconnected"
        );
      }
    };


  // ----------------------------------------------
  // PEER CONNECTION STATE
  // ----------------------------------------------

  peer.onconnectionstatechange =
    () => {
      const state =
        peer?.connectionState;

      console.log(
        "🔌 Peer connection state:",
        state
      );

      if (state === "connected") {
        if (connectionTimer) {
          clearTimeout(connectionTimer);
          connectionTimer = null;
        }

        if (callStatus) {
          callStatus.textContent =
            "Connected";
        }

        console.log(
          "✅ WEBRTC CONNECTED"
        );
      }


      if (state === "failed") {
        console.error(
          "❌ WEBRTC CONNECTION FAILED"
        );

        if (callStatus) {
          callStatus.textContent =
            "Connection failed";
        }
      }


      if (state === "disconnected") {
        console.warn(
          "⚠️ WEBRTC DISCONNECTED"
        );

        if (callStatus) {
          callStatus.textContent =
            "Reconnecting...";
        }
      }


      if (state === "closed") {
        console.warn(
          "⚠️ WEBRTC CLOSED"
        );
      }
    };


  // ----------------------------------------------
  // SIGNALING STATE
  // ----------------------------------------------

  peer.onsignalingstatechange =
    () => {
      console.log(
        "📡 Signaling state:",
        peer?.signalingState
      );
    };


  return peer;
}


// --------------------------------------------------
// START OUTGOING CALL
// --------------------------------------------------

async function startCall(mode) {
  if (!socket?.connected) {
    alert(
      "Chat connection is not ready. Please wait a moment and try again."
    );
    return;
  }

  try {
    // Always refresh TURN configuration
    // before creating the peer.
    await loadWebRTCConfig();

    await cleanupCall(false);

    callTarget =
      otherUserId.toString();

    callMode = mode;

    localStream =
      await getCallMedia(mode);

    openCall(
      mode,
      `Calling ${chatUserName}...`
    );

    setupPeer(callTarget);


    // Add local media tracks.
    localStream
      .getTracks()
      .forEach((track) => {
        peer.addTrack(
          track,
          localStream
        );
      });


    if (localVideo) {
      localVideo.srcObject =
        localStream;
    }


    // Create offer.
    const offer =
      await peer.createOffer();

    await peer.setLocalDescription(
      offer
    );


    console.log(
      "📤 Sending call offer"
    );

    socket.emit("callOffer", {
      to: callTarget,
      offer: peer.localDescription,
      mode,
    });


    // Connection timeout.
    connectionTimer =
      setTimeout(() => {
        if (
          peer &&
          peer.connectionState !==
            "connected"
        ) {
          console.warn(
            "⏱️ Call is taking longer than expected."
          );

          if (callStatus) {
            callStatus.textContent =
              "Connecting...";
          }
        }
      }, 15000);

  } catch (error) {
    console.error(
      "❌ Start call error:",
      error
    );

    alert(
      error.message ||
        "Could not start call"
    );

    await cleanupCall(false);
  }
}


// --------------------------------------------------
// ACCEPT INCOMING CALL
// --------------------------------------------------

async function acceptIncomingCall() {
  const data =
    incomingCall;

  if (!data) return;

  hideIncomingCall();

  try {
    await loadWebRTCConfig();

    await cleanupCall(false);

    callTarget =
      data.from.toString();

    callMode =
      data.mode === "audio"
        ? "audio"
        : "video";

    localStream =
      await getCallMedia(callMode);

    openCall(
      callMode,
      `Connecting to ${chatUserName}...`
    );

    setupPeer(callTarget);


    // Add our local tracks.
    localStream
      .getTracks()
      .forEach((track) => {
        peer.addTrack(
          track,
          localStream
        );
      });


    if (localVideo) {
      localVideo.srcObject =
        localStream;
    }


    // Apply remote offer FIRST.
    await peer.setRemoteDescription(
      new RTCSessionDescription(
        data.offer
      )
    );

    console.log(
      "✅ Remote offer applied"
    );


    // Now it is safe to add any ICE
    // candidates that arrived before
    // the offer was accepted.
    await flushIceCandidates(
      callTarget
    );


    // Create answer.
    const answer =
      await peer.createAnswer();

    await peer.setLocalDescription(
      answer
    );


    console.log(
      "📤 Sending call answer"
    );

    socket.emit("callAnswer", {
      to: callTarget,
      answer: peer.localDescription,
    });


    if (callStatus) {
      callStatus.textContent =
        "Connecting...";
    }

  } catch (error) {
    console.error(
      "❌ Answer call error:",
      error
    );

    alert(
      error.message ||
        "Could not answer the call"
    );

    await cleanupCall(false);
  }
}


// --------------------------------------------------
// DECLINE INCOMING CALL
// --------------------------------------------------

function declineIncomingCall() {
  const data =
    incomingCall;

  hideIncomingCall();

  if (
    data?.from &&
    socket?.connected
  ) {
    socket.emit("callReject", {
      to: data.from,
    });
  }

  clearIceQueue(
    data?.from
  );
}


// --------------------------------------------------
// INCOMING CALL OFFER
// --------------------------------------------------

socket.on(
  "callOffer",
  async (data) => {
    if (
      !data?.from ||
      data.from.toString() !==
        otherUserId.toString()
    ) {
      return;
    }


    // If we are already in another call,
    // don't replace it.
    if (
      incomingCall ||
      callTarget ||
      callOverlay?.classList.contains(
        "open"
      )
    ) {
      console.warn(
        "⚠️ Ignoring incoming call because another call is active."
      );
      return;
    }


    console.log(
      "📞 Incoming call offer received"
    );


    incomingCall = data;


    incomingCallTitle.textContent =
      `${chatUserName} is calling`;


    incomingCallSubtitle.textContent =
      data.mode === "video"
        ? "Incoming video call"
        : "Incoming audio call";


    if (incomingCallAvatar) {
      incomingCallAvatar.src =
        profilePhoto?.src ||
        "data:image/svg+xml;charset=UTF-8," +
          encodeURIComponent(
            '<svg xmlns="http://www.w3.org/2000/svg" width="100" height="100"><rect width="100%" height="100%" fill="#25182f"/><text x="50%" y="58%" text-anchor="middle" fill="white" font-size="44">❤️</text></svg>'
          );
    }


    incomingCallModal?.classList.add(
      "open"
    );


    // IMPORTANT:
    // ICE candidates may have arrived
    // before this offer.
    //
    // We don't delete them here.
    // acceptIncomingCall() will flush
    // them after setRemoteDescription().
    const queued =
      pendingIceByPeer.get(
        String(data.from)
      );

    if (queued?.length) {
      console.log(
        "🧊 ICE candidates already waiting:",
        queued.length
      );
    }
  }
);


// --------------------------------------------------
// ANSWER RECEIVED
// --------------------------------------------------

socket.on(
  "callAnswer",
  async (data) => {
    if (
      !peer ||
      !callTarget ||
      !data?.from ||
      data.from.toString() !==
        String(callTarget)
    ) {
      return;
    }


    try {
      await peer.setRemoteDescription(
        new RTCSessionDescription(
          data.answer
        )
      );


      console.log(
        "✅ Remote answer received"
      );


      // The caller may have received
      // ICE candidates before the answer.
      await flushIceCandidates(
        callTarget
      );

    } catch (error) {
      console.error(
        "❌ Answer SDP error:",
        error
      );
    }
  }
);


// --------------------------------------------------
// ICE CANDIDATE RECEIVED
// --------------------------------------------------

socket.on(
  "callIce",
  async (data) => {
    if (
      !data?.from ||
      !data?.candidate
    ) {
      return;
    }


    const fromId =
      data.from.toString();


    // Only accept candidates from:
    // - current call target
    // - the person whose incoming
    //   call we're currently seeing
    // - the chat partner
    const allowedId =
      callTarget?.toString() ||
      incomingCall?.from?.toString() ||
      otherUserId?.toString();


    if (
      allowedId &&
      fromId !== String(allowedId)
    ) {
      return;
    }


    let candidate;

    try {
      candidate =
        new RTCIceCandidate(
          data.candidate
        );
    } catch (error) {
      console.warn(
        "⚠️ Invalid ICE candidate:",
        error
      );
      return;
    }


    // If the peer isn't ready OR the
    // remote description isn't ready,
    // KEEP the candidate instead of
    // dropping it.
    if (
      !peer ||
      !peer.remoteDescription
    ) {
      queueIceCandidate(
        fromId,
        candidate
      );

      return;
    }


    try {
      await peer.addIceCandidate(
        candidate
      );

      console.log(
        "✅ Remote ICE candidate added"
      );

    } catch (error) {
      console.error(
        "❌ ICE candidate error:",
        error
      );
    }
  }
);


// --------------------------------------------------
// CALL REJECTED
// --------------------------------------------------

socket.on(
  "callReject",
  (data) => {
    if (
      data?.from &&
      data.from.toString() ===
        String(callTarget)
    ) {
      alert("Call declined");

      cleanupCall(false);
    }
  }
);


// --------------------------------------------------
// CALL ENDED
// --------------------------------------------------

socket.on(
  "callEnd",
  (data) => {
    if (
      data?.from &&
      data.from.toString() ===
        String(callTarget)
    ) {
      cleanupCall(false);
    }
  }
);


// --------------------------------------------------
// BUTTON EVENTS
// --------------------------------------------------

incomingAccept?.addEventListener(
  "click",
  acceptIncomingCall
);

incomingDecline?.addEventListener(
  "click",
  declineIncomingCall
);

videoCallBtn?.addEventListener(
  "click",
  () => startCall("video")
);

audioCallBtn?.addEventListener(
  "click",
  () => startCall("audio")
);

endCallBtn?.addEventListener(
  "click",
  () => cleanupCall(true)
);


// --------------------------------------------------
// MUTE
// --------------------------------------------------

muteBtn?.addEventListener(
  "click",
  () => {
    const track =
      localStream?.getAudioTracks()[0];

    if (track) {
      track.enabled =
        !track.enabled;

      muteBtn.textContent =
        track.enabled
          ? "🎙️"
          : "🔇";
    }
  }
);


// --------------------------------------------------
// CAMERA
// --------------------------------------------------

cameraBtn?.addEventListener(
  "click",
  () => {
    const track =
      localStream?.getVideoTracks()[0];

    if (track) {
      track.enabled =
        !track.enabled;

      cameraBtn.textContent =
        track.enabled
          ? "📷"
          : "🚫";
    }
  }
);


// --------------------------------------------------
// PAGE CLOSE
// --------------------------------------------------

window.addEventListener(
  "beforeunload",
  () => {
    if (
      callTarget &&
      socket?.connected
    ) {
      socket.emit("callEnd", {
        to: callTarget,
      });
    }
  }
);      // =========================
      // START
      // =========================

      getCurrentUser();
      loadWebRTCConfig();
      loadChat();
    </script>
    <script src="js/animated-ui.js"></script>
</body>
</html>
