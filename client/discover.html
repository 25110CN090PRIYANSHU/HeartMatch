<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Discover — HeartMatch</title>
  <link rel="stylesheet" href="/css/app.css">
  <link rel="stylesheet" href="/css/notification-badge.css">
  <link rel="stylesheet" href="css/animated-ui.css">
  <link rel="stylesheet" href="css/responsive.css">
</head>
<body>
  <nav class="nav">
    <div class="brand">❤️ <span>HeartMatch</span></div>
    <div class="navlinks">
      <a href="profile.html">Profile</a>
      <a href="matches.html">Matches</a>
      <a href="notifications.html" class="hm-notification-link">Notifications</a>
      <a href="settings.html">Settings</a>
      <button type="button" onclick="HM.logout()">Logout</button>
    </div>
  </nav>

  <main class="wrap">
    <div class="section-title">
      <div>
        <h1>Discover</h1>
        <p class="muted">Discover all HeartMatch users.</p>
      </div>
      <button id="refreshBtn" class="btn ghost" type="button">Refresh</button>
    </div>

    <div id="msg" class="msg"></div>



    <!-- Classification & Filters -->
    <section class="card" style="margin-bottom:18px">
      <div style="display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:10px;margin-bottom:14px">
        <div>
          <h2 style="margin:0 0 4px">Classification &amp; Filters 🎯</h2>
          <p class="muted" style="margin:0">Classify profiles by category, age, and location.</p>
        </div>
        <div id="filterCountBadge" class="filter-count-badge" style="display:none"></div>
      </div>

      <div class="filter-grid">
        <div class="field" style="margin:0">
          <label for="filterCategory">Category</label>
          <select id="filterCategory" class="search-input filter-control">
            <option value="all">All (Men, Women, Other)</option>
            <option value="men">Men</option>
            <option value="women">Women</option>
            <option value="other">Other</option>
          </select>
        </div>

        <div class="field" style="margin:0">
          <label>Age Range</label>
          <div style="display:flex;gap:8px;align-items:center">
            <input id="filterMinAge" class="search-input filter-control" type="number" min="18" max="100" placeholder="Min (18)" style="flex:1;min-width:0">
            <span class="muted" style="font-weight:bold">–</span>
            <input id="filterMaxAge" class="search-input filter-control" type="number" min="18" max="100" placeholder="Max (100)" style="flex:1;min-width:0">
          </div>
        </div>

        <div class="field" style="margin:0">
          <label for="filterLocation">Location</label>
          <input id="filterLocation" class="search-input filter-control" type="text" placeholder="e.g. Delhi, London, etc." maxlength="80">
        </div>
      </div>

      <div style="display:flex;gap:10px;flex-wrap:wrap;margin-top:16px;align-items:center">
        <button id="applyFiltersBtn" class="btn" type="button">Apply Filters 🔍</button>
        <button id="resetFiltersBtn" class="btn ghost" type="button">Reset Filters</button>
        <span id="activeFiltersSummary" class="muted" style="font-size:13px;margin-left:auto"></span>
      </div>
    </section>

    <section class="card" style="margin-bottom:18px">
      <h2>Find someone by User ID 🔎</h2>
      <p class="muted">Enter their unique User ID to open their profile.</p>
      <div style="display:flex;gap:10px;flex-wrap:wrap">
        <input id="userSearch" class="search-input" autocomplete="off" placeholder="e.g. priyanshu123" maxlength="24" style="flex:1;min-width:220px">
        <button id="findUserBtn" class="btn" type="button">Find user</button>
      </div>
      <div id="searchResult" class="msg"></div>
    </section>

    <div id="grid" class="grid"></div>
  </main>

  <script src="/js/app.js"></script>
  <script>
    HM.requireAuth();

    const grid = document.getElementById("grid");
    const msg = document.getElementById("msg");
    const refreshBtn = document.getElementById("refreshBtn");
    const userSearch = document.getElementById("userSearch");
    const findUserBtn = document.getElementById("findUserBtn");
    const searchResult = document.getElementById("searchResult");

    const filterCategory = document.getElementById("filterCategory");
    const filterMinAge = document.getElementById("filterMinAge");
    const filterMaxAge = document.getElementById("filterMaxAge");
    const filterLocation = document.getElementById("filterLocation");
    const applyFiltersBtn = document.getElementById("applyFiltersBtn");
    const resetFiltersBtn = document.getElementById("resetFiltersBtn");
    const filterCountBadge = document.getElementById("filterCountBadge");
    const activeFiltersSummary = document.getElementById("activeFiltersSummary");

    let loading = false;

    function setMessage(text, type = "") {
      msg.textContent = text || "";
      msg.className = "msg" + (type ? " " + type : "");
    }

    const HM_FALLBACK_IMAGE = "data:image/svg+xml;charset=UTF-8," + encodeURIComponent(
      '<svg xmlns="http://www.w3.org/2000/svg" width="400" height="400"><rect width="100%" height="100%" fill="#25182f"/><text x="50%" y="55%" text-anchor="middle" fill="white" font-size="110">❤️</text></svg>'
    );

    function profileImage(u) {
      if (u.profileImage) return HM.esc(u.profileImage);
      return HM_FALLBACK_IMAGE;
    }

    function formatCategory(gender) {
      const g = String(gender || "").toLowerCase();
      if (g === "male" || g === "men") return "Men";
      if (g === "female" || g === "women") return "Women";
      if (g === "other") return "Other";
      return "";
    }

    function updateBadge(count) {
      if (!filterCountBadge) return;
      filterCountBadge.style.display = "inline-block";
      filterCountBadge.textContent = `${count} ${count === 1 ? "profile" : "profiles"}`;
    }

    function updateFilterSummary(cat, min, max, loc) {
      if (!activeFiltersSummary) return;
      const parts = [];
      if (cat && cat !== "all") {
        const catMap = { men: "Men", women: "Women", other: "Other" };
        parts.push(catMap[cat] || cat);
      }
      if (min && max) parts.push(`Age ${min}–${max}`);
      else if (min) parts.push(`Age ${min}+`);
      else if (max) parts.push(`Age ≤ ${max}`);

      if (loc) parts.push(`Near "${loc}"`);

      if (parts.length > 0) {
        activeFiltersSummary.textContent = "Filters: " + parts.join(" • ");
      } else {
        activeFiltersSummary.textContent = "Showing all categories, ages & locations";
      }
    }

    function hasActiveFilters() {
      return (
        (filterCategory && filterCategory.value !== "all") ||
        Boolean(filterMinAge && filterMinAge.value.trim()) ||
        Boolean(filterMaxAge && filterMaxAge.value.trim()) ||
        Boolean(filterLocation && filterLocation.value.trim())
      );
    }

    function renderNoUsersFound() {
      if (hasActiveFilters()) {
        grid.innerHTML = `
          <div class="card" style="text-align:center;padding:34px 20px">
            <h2>No matching profiles found 🔍</h2>
            <p class="muted">No users matched your classification filters.</p>
            <div style="margin-top:14px">
              <button class="btn ghost" type="button" onclick="resetFilters()">Clear filters &amp; view all</button>
            </div>
          </div>
        `;
      } else {
        grid.innerHTML = '<div class="card"><h2>No users found.</h2><p class="muted">There are no other users to display right now.</p></div>';
      }
    }

    function renderUsers(users) {
      if (!Array.isArray(users) || users.length === 0) {
        renderNoUsersFound();
        return;
      }

      grid.innerHTML = users.map(u => {
        const catLabel = formatCategory(u.gender);
        return `
        <article class="card">
          <img class="profile-img" src="${profileImage(u)}" alt="Profile" onerror="this.onerror=null;this.src=HM_FALLBACK_IMAGE">
          <h3>${HM.esc(u.name)}, ${HM.esc(u.age)} ${u.isVerified ? "✓" : ""}</h3>
          <p class="muted">@${HM.esc(u.userId || "user")}</p>
          <p class="muted">📍 ${HM.esc(u.location || "Location not set")}</p>
          <p>${HM.esc(u.bio || "No bio yet.")}</p>
          <div class="tags">
            ${catLabel ? `<span class="tag tag-category">${HM.esc(catLabel)}</span>` : ""}
            ${(u.interests || []).slice(0, 6).map(i => `<span class="tag">${HM.esc(i)}</span>`).join("")}
          </div>
          <div class="card-actions">
            <button class="btn ghost" type="button" onclick="act('${u._id}','pass',this)">Pass</button>
            <button class="btn" type="button" onclick="act('${u._id}','like',this)">Like ❤️</button>
          </div>
          <div style="display:flex;gap:8px;margin-top:9px">
            <button class="btn ghost" style="flex:1" type="button" onclick="blockUser('${u._id}')">Block</button>
            <button class="btn ghost" style="flex:1" type="button" onclick="reportUser('${u._id}')">Report</button>
          </div>
        </article>
      `;
      }).join("");
    }

    async function load() {
      if (loading) return;
      loading = true;
      refreshBtn.disabled = true;
      refreshBtn.textContent = "Refreshing...";
      if (applyFiltersBtn) applyFiltersBtn.disabled = true;
      setMessage("");
      grid.innerHTML = '<div class="card">Finding people... 💕</div>';

      const params = new URLSearchParams();
      const catVal = filterCategory ? filterCategory.value : "all";
      const minAgeVal = filterMinAge ? filterMinAge.value.trim() : "";
      const maxAgeVal = filterMaxAge ? filterMaxAge.value.trim() : "";
      const locVal = filterLocation ? filterLocation.value.trim() : "";

      if (catVal && catVal !== "all") params.append("category", catVal);
      if (minAgeVal) params.append("minAge", minAgeVal);
      if (maxAgeVal) params.append("maxAge", maxAgeVal);
      if (locVal) params.append("location", locVal);

      updateFilterSummary(catVal, minAgeVal, maxAgeVal, locVal);

      const qs = params.toString();
      const url = "/api/discover" + (qs ? "?" + qs : "");

      try {
        const { r, d } = await HM.api(url);

        if (!r.ok) {
          grid.innerHTML = "";
          setMessage(d?.message || "Could not load Discover. Please try again.", "err");
          updateBadge(0);
          return;
        }

        const users = d?.users || [];
        updateBadge(users.length);
        renderUsers(users);
      } catch (error) {
        console.error("Discover load error:", error);
        grid.innerHTML = '<div class="card"><h2>Could not load Discover.</h2><p class="muted">Check your connection and try again.</p></div>';
        setMessage("Could not load Discover. Please try again.", "err");
        updateBadge(0);
      } finally {
        loading = false;
        refreshBtn.disabled = false;
        refreshBtn.textContent = "Refresh";
        if (applyFiltersBtn) applyFiltersBtn.disabled = false;
      }
    }

    function resetFilters() {
      if (filterCategory) filterCategory.value = "all";
      if (filterMinAge) filterMinAge.value = "";
      if (filterMaxAge) filterMaxAge.value = "";
      if (filterLocation) filterLocation.value = "";
      load();
    }

    async function searchUser() {
      const value = userSearch.value.trim().toLowerCase();
      searchResult.textContent = "";

      if (!value) {
        searchResult.textContent = "Enter a User ID.";
        return;
      }

      findUserBtn.disabled = true;
      findUserBtn.textContent = "Searching...";
      searchResult.textContent = "Searching...";

      try {
        const { r, d } = await HM.api("/api/profile/search/" + encodeURIComponent(value));

        if (!r.ok || !d?.user) {
          searchResult.textContent = d?.message || "No user found with that User ID.";
          return;
        }

        const user = d.user;
        searchResult.innerHTML = `
          Found <b>@${HM.esc(user.userId)}</b> — ${HM.esc(user.name)}
          <button id="openFoundProfile" class="btn ghost" style="margin-left:8px" type="button">Open profile</button>
        `;

        document.getElementById("openFoundProfile").addEventListener("click", () => {
          window.location.href = "person.html?user=" + encodeURIComponent(user.userId);
        });
      } catch (error) {
        console.error("User search error:", error);
        searchResult.textContent = "Search failed. Please try again.";
      } finally {
        findUserBtn.disabled = false;
        findUserBtn.textContent = "Find user";
      }
    }

    async function act(id, type, button) {
      const card = button?.closest("article.card");
      button.disabled = true;
      try {
        const { r, d } = await HM.api("/api/likes", {
          method: "POST",
          body: { to: id, type }
        });
        if (!r.ok) {
          alert(d?.message || "Action failed");
          button.disabled = false;
          return;
        }

        // Remove the acted-on profile immediately. The server also excludes
        // acted-on users on the next Discover refresh.
        card?.remove();
        const remaining = grid.querySelectorAll("article.card").length;
        updateBadge(remaining);
        if (remaining === 0) {
          renderNoUsersFound();
        }
      } catch (error) {
        console.error(error);
        alert("Action failed. Please try again.");
        button.disabled = false;
      }
    }

    async function blockUser(id) {
      if (!confirm("Block this user?")) return;
      try {
        const { d } = await HM.api("/api/blocks/" + encodeURIComponent(id), { method: "POST" });
        alert(d?.message || "Blocked");
        await load();
      } catch (error) {
        console.error(error);
        alert("Could not block this user.");
      }
    }

    async function reportUser(id) {
      const reason = prompt("Why are you reporting this profile?");
      if (!reason) return;
      try {
        const { d } = await HM.api("/api/reports/" + encodeURIComponent(id), {
          method: "POST",
          body: { reason }
        });
        alert(d?.message || "Report sent");
      } catch (error) {
        console.error(error);
        alert("Could not send report.");
      }
    }

    refreshBtn.addEventListener("click", load);
    if (applyFiltersBtn) applyFiltersBtn.addEventListener("click", load);
    if (resetFiltersBtn) resetFiltersBtn.addEventListener("click", resetFilters);
    if (filterCategory) filterCategory.addEventListener("change", load);

    [filterMinAge, filterMaxAge, filterLocation].forEach(input => {
      if (!input) return;
      input.addEventListener("keydown", event => {
        if (event.key === "Enter") {
          event.preventDefault();
          load();
        }
      });
    });

    findUserBtn.addEventListener("click", searchUser);
    userSearch.addEventListener("keydown", event => {
      if (event.key === "Enter") searchUser();
    });

    load();
  </script>
  <script src="js/notification-badge.js"></script>
  <script src="js/animated-ui.js"></script>
</body>
</html>
