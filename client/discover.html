<!doctype html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Discover — HeartMatch</title><link rel="stylesheet" href="/css/app.css"></head><body><nav class="nav"><div class="brand">❤️ <span>HeartMatch</span></div><div class="navlinks"><a href="profile.html">Profile</a><a href="matches.html">Matches</a><a href="notifications.html">Notifications</a><a href="settings.html">Settings</a><button onclick="HM.logout()">Logout</button></div></nav><main class="wrap"><div class="section-title"><div><h1>Discover</h1><p class="muted">People matching your preferences.</p></div><button class="btn ghost" onclick="load()">Refresh</button></div><div id="msg" class="msg"></div><section class="card" style="margin-bottom:18px"><h2>Find someone by User ID 🔎</h2><p class="muted">Enter their unique User ID to open their profile.</p><div style="display:flex;gap:10px;flex-wrap:wrap"><input id="userSearch" class="search-input" placeholder="e.g. priyanshu123" maxlength="24" style="flex:1;min-width:220px"><button class="btn" onclick="searchUser()">Find user</button></div><div id="searchResult" class="msg"></div></section><div id="grid" class="grid"></div></main><script src="/js/app.js"></script><script>HM.requireAuth();const grid=document.getElementById('grid');async function load(){grid.innerHTML='<div class="card">Finding people... 💕</div>';const {r,d}=await HM.api('/api/discover');if(!r.ok){grid.innerHTML='';msg.textContent=d.message;return}if(!d.users.length){grid.innerHTML='<div class="card"><h2>No new profiles right now.</h2><p class="muted">Try widening your preferences in Profile.</p></div>';return}grid.innerHTML=d.users.map(u=>`<article class="card"><img class="profile-img" src="${HM.esc(u.profileImage||'data:image/svg+xml;charset=UTF-8,'+encodeURIComponent('<svg xmlns="http://www.w3.org/2000/svg" width="400" height="400"><rect width="100%" height="100%" fill="#25182f"/><text x="50%" y="55%" text-anchor="middle" fill="white" font-size="110">❤️</text></svg>'))}" alt="Profile"><h3>${HM.esc(u.name)}, ${u.age} ${u.isVerified?'✓':''}</h3><p class="muted">@${HM.esc(u.userId||'user')}</p><p class="muted">${HM.esc(u.location||'Location not set')}</p><p>${HM.esc(u.bio||'No bio yet.')}</p><div class="tags">${(u.interests||[]).slice(0,6).map(i=>`<span class="tag">${HM.esc(i)}</span>`).join('')}</div><div class="card-actions"><button class="btn ghost" onclick="act('${u._id}','pass',this)">Pass</button><button class="btn" onclick="act('${u._id}','like',this)">Like ❤️</button></div><div style="display:flex;gap:8px;margin-top:9px"><button class="btn ghost" style="flex:1" onclick="blockUser('${u._id}')">Block</button><button class="btn ghost" style="flex:1" onclick="reportUser('${u._id}')">Report</button></div></article>`).join('')}async function searchUser(){const value=document.getElementById('userSearch').value.trim().toLowerCase();const out=document.getElementById('searchResult');if(!value){out.textContent='Enter a User ID.';return}out.textContent='Searching...';const {r,d}=await HM.api('/api/profile/search/'+encodeURIComponent(value));if(!r.ok){out.textContent=d.message||'User not found';return}out.innerHTML='Found <b>@'+HM.esc(d.user.userId)+'</b> — '+HM.esc(d.user.name)+' <button class="btn ghost" style="margin-left:8px" onclick="location.href='person.html?id='+encodeURIComponent(d.user.userId)+''">Open profile</button>'}async function act(id,type,b){b.disabled=true;const {r,d}=await HM.api('/api/likes',{method:'POST',body:{to:id,type}});if(!r.ok)alert(d.message||'Action failed');await load()}async function blockUser(id){if(!confirm('Block this user?'))return;const {d}=await HM.api('/api/blocks/'+id,{method:'POST'});alert(d.message||'Blocked');load()}async function reportUser(id){const reason=prompt('Why are you reporting this profile?');if(!reason)return;const {d}=await HM.api('/api/reports/'+id,{method:'POST',body:{reason}});alert(d.message||'Report sent')}load();</script></body></html>
