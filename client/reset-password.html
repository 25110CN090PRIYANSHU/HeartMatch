<!doctype html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>New password — HeartMatch</title>
  <link rel="manifest" href="/manifest.json">
  <meta name="theme-color" content="#090812">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="HeartMatch">
  <link rel="apple-touch-icon" href="/images/icons/apple-touch-icon.png">
  <link rel="icon" type="image/svg+xml" href="/images/icons/icon.svg">
  <link rel="stylesheet" href="/css/app.css">  <link rel="stylesheet" href="css/animated-ui.css">
  <link rel="stylesheet" href="css/responsive.css">
</head><body><main class="form card"><h1>Choose a new password</h1><div class="field"><label>New password</label><input id="password" type="password" minlength="8" autocomplete="new-password"></div><div class="field"><label>Confirm password</label><input id="confirmPassword" type="password" minlength="8" autocomplete="new-password"></div><button class="btn" style="width:100%" onclick="resetIt()">Reset password</button><div id="msg" class="msg"></div></main><script src="/js/app.js"></script><script>
const resetToken = new URLSearchParams(location.search).get('token');
if (!resetToken) {
  msg.textContent = 'This reset link is missing its token. Please request a new link.';
}
async function resetIt(){
  const value = password.value;
  const confirmation = confirmPassword.value;
  if (!resetToken) return;
  if (value.length < 8) {
    msg.textContent = 'Password must be at least 8 characters.';
    return;
  }
  if (value !== confirmation) {
    msg.textContent = 'Passwords do not match.';
    return;
  }
  const {r,d}=await HM.api('/api/auth/reset-password',{
    method:'POST',
    body:{token:resetToken,password:value}
  });
  msg.textContent=d.message||'Done';
  if(r.ok)setTimeout(()=>location.href='login.html',1500);
}
</script>  <script src="js/animated-ui.js"></script>
  <script src="/js/pwa-install.js" defer></script>
</body></html>
