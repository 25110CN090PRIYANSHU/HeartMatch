<!doctype html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>New password — HeartMatch</title><link rel="stylesheet" href="/css/app.css">  <link rel="stylesheet" href="css/animated-ui.css">
</head><body><main class="form card"><h1>Choose a new password</h1><div class="field"><label>New password</label><input id="password" type="password"></div><button class="btn" style="width:100%" onclick="resetIt()">Reset password</button><div id="msg" class="msg"></div></main><script src="/js/app.js"></script><script>async function resetIt(){const {r,d}=await HM.api('/api/auth/reset-password',{method:'POST',body:{token:new URLSearchParams(location.search).get('token'),password:password.value}});msg.textContent=d.message||'Done';if(r.ok)setTimeout(()=>location.href='login.html',1500)}</script>  <script src="js/animated-ui.js"></script>
</body></html>
