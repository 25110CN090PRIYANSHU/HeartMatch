<!doctype html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Admin — HeartMatch</title><link rel="stylesheet" href="/css/app.css">  <link rel="stylesheet" href="css/animated-ui.css">
  <link rel="stylesheet" href="css/responsive.css">
</head><body><nav class="nav"><div class="brand">❤️ <span>HeartMatch Admin</span></div><div class="navlinks"><a href="discover.html">Site</a><button onclick="HM.logout()">Logout</button></div></nav><main class="wrap"><h1>Admin dashboard</h1><div id="stats" class="grid"></div><section class="card" style="margin-top:20px"><div class="section-title"><h2>Reports</h2><button class="btn ghost" onclick="load()">Refresh</button></div><div id="reports"></div></section><section class="card" style="margin-top:20px"><h2>Users</h2><div id="users"></div></section></main><script src="/js/app.js"></script><script>HM.requireAuth();async function load(){const s=await HM.api('/api/admin/stats');if(!s.r.ok){document.body.innerHTML='<main class="form card"><h1>Admin access required</h1><a class="btn" href="discover.html" style="display:block;text-align:center">Back</a></main>';return}stats.innerHTML=Object.entries(s.d).map(([k,v])=>`<div class="card"><h2>${v}</h2><p class="muted">${k}</p></div>`).join('');const a=await HM.api('/api/admin/reports');reports.innerHTML=a.d.reports?.length?a.d.reports.map(x=>`<div class="notice"><b>${HM.esc(x.reported?.name||'User')}</b> — ${HM.esc(x.reason)}<br><small class="muted">Status: ${x.status}</small><br><button class="btn ghost" onclick="review('${x._id}','reviewed')">Mark reviewed</button> <button class="btn ghost" onclick="review('${x._id}','dismissed')">Dismiss</button></div>`).join(''):'No reports.';const u=await HM.api('/api/admin/users');users.innerHTML=u.d.users?.map(x=>`<div class="notice"><b>${HM.esc(x.name)}</b> — ${HM.esc(x.email)} — ${x.isActive?'Active':'Disabled'} <button class="btn ghost" style="float:right" onclick="status('${x._id}',${!x.isActive})">${x.isActive?'Disable':'Enable'}</button></div>`).join(''):'No users.'}async function review(id,status){await HM.api('/api/admin/reports/'+id,{method:'PUT',body:{status}});load()}async function status(id,isActive){await HM.api('/api/admin/users/'+id+'/status',{method:'PUT',body:{isActive}});load()}load();</script>  <script src="js/animated-ui.js"></script>
</body></html>
