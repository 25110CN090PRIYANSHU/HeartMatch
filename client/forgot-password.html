</head><body><main class="form card"><h1>Reset password 🔐</h1><p class="muted">Enter your email. In development, a reset link is shown if SMTP is not configured.</p><div class="field"><label>Email</label><input id="email" type="email"></div><button class="btn" style="width:100%" onclick="go()">Send reset link</button><div id="msg" class="msg"></div><p style="text-align:center"><a href="login.html" class="muted">Back to login</a></p></main><script src="/js/app.js"></script><script>async function go(){const {r,d}=await HM.api('/api/auth/forgot-password',{method:'POST',body:{email:email.value}});msg.textContent=d.message||'Done';if(d.resetUrl){const a=document.createElement('a');a.href=d.resetUrl;a.textContent='Open reset page';a.style.display='block';a.style.marginTop='10px';msg.appendChild(a)}}</script>  <script src="js/animated-ui.js"></script>
  <script src="/js/pwa-install.js" defer></script>
</body></html>
