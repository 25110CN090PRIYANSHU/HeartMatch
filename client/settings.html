<!doctype html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Settings — HeartMatch</title><link rel="stylesheet" href="/css/app.css"></head><body><nav class="nav"><div class="brand">❤️ <span>HeartMatch</span></div><div class="navlinks"><a href="discover.html">Discover</a><a href="profile.html">Profile</a><a href="matches.html">Matches</a><button onclick="HM.logout()">Logout</button></div></nav><main class="wrap"><h1>Settings</h1><div class="grid"><section class="card"><h2>Change password</h2><div class="field"><label>Current password</label><input id="current" type="password"></div><div class="field"><label>New password</label><input id="newp" type="password"></div><button class="btn" onclick="changePass()">Change password</button><div id="passMsg" class="msg"></div></section><section class="card"><h2>Blocked users</h2><div id="blocked" class="muted">Loading...</div></section><section class="card"><h2>Account</h2><p class="muted">Deleting your account permanently removes your profile and login.</p><button class="btn danger" onclick="deleteAccount()">Delete account</button><div id="delMsg" class="msg"></div></section></div></main><script src="/js/app.js"></script><script>HM.requireAuth();async function changePass(){const {r,d}=await HM.api('/api/profile/password',{method:'PUT',body:{currentPassword:current.value,newPassword:newp.value}});passMsg.textContent=d.message||'Done';if(r.ok){current.value='';newp.value=''}}async function loadBlocked(){const {d}=await HM.api('/api/blocks');blocked.innerHTML=d.blocked?.length?d.blocked.map(b=>`<div class="notice"><b>${HM.esc(b.blocked.name)}</b><button class="btn ghost" style="float:right" onclick="unblock('${b.blocked._id}')">Unblock</button></div>`).join(''):'No blocked users.'}async function unblock(id){await HM.api('/api/blocks/'+id,{method:'DELETE'});loadBlocked()}async function deleteAccount(){if(!confirm('Delete your HeartMatch account permanently?'))return;const {r,d}=await HM.api('/api/profile/account',{method:'DELETE'});delMsg.textContent=d.message||'Done';if(r.ok)HM.logout()}loadBlocked();</script></body></html>
