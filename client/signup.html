<!doctype html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Create account — HeartMatch</title>
  <link rel="manifest" href="/manifest.json">
  <meta name="theme-color" content="#090812">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="HeartMatch">
  <link rel="apple-touch-icon" href="/images/icons/apple-touch-icon.png">
  <link rel="icon" type="image/png" sizes="192x192" href="/images/icons/icon-192.png">
  <link rel="icon" type="image/png" sizes="512x512" href="/images/icons/icon-512.png">
  <link rel="icon" type="image/svg+xml" href="/images/icons/icon.svg">
  <link rel="icon" type="image/x-icon" href="/favicon.ico">
  <link rel="stylesheet" href="/css/app.css">  <link rel="stylesheet" href="css/animated-ui.css">
  <link rel="stylesheet" href="css/responsive.css">
</head><body><nav class="nav"><div class="brand">❤️ <span>HeartMatch</span></div><div class="navlinks"><a href="login.html">Login</a></div></nav><main class="form card"><h1>Create your account</h1><p class="muted" style="text-align:center">You must be 18 or older.</p>

<div class="signup-avatar-wrap" style="text-align: center; margin: 18px 0 20px;">
  <div id="avatarPreviewBox" onclick="document.getElementById('signupPhotoInput').click()" style="width: 104px; height: 104px; border-radius: 50%; margin: 0 auto 10px; background: rgba(255,255,255,0.06); border: 2px dashed #ff3d8d; display: flex; flex-direction: column; align-items: center; justify-content: center; cursor: pointer; overflow: hidden; position: relative; transition: all .2s ease;">
    <img id="avatarPreviewImg" src="" alt="Profile Preview" style="width: 100%; height: 100%; object-fit: cover; display: none;" />
    <span id="avatarPlaceholderIcon" style="font-size: 32px; line-height: 1;">📷</span>
    <span id="avatarPlaceholderText" style="font-size: 11px; color: #ff9cbd; margin-top: 4px; font-weight: bold;">Add Photo *</span>
  </div>
  <button type="button" class="btn alt" style="font-size: 12px; padding: 6px 14px;" onclick="document.getElementById('signupPhotoInput').click()">Upload Profile Picture *</button>
  <input type="file" id="signupPhotoInput" accept="image/jpeg,image/png,image/webp" style="display: none;" />
  <div id="photoStatus" style="font-size: 12px; color: #ff9cbd; margin-top: 6px; font-weight: 500;">* Profile photo is strictly mandatory</div>
</div>

<div class="field"><label>Name</label><input id="name"></div><div class="two"><div class="field"><label>Age</label><input id="age" type="number" min="18"></div><div class="field"><label>Gender</label><select id="gender"><option value="male">Male</option><option value="female">Female</option><option value="non-binary">Non-binary</option><option value="genderfluid">Genderfluid</option><option value="other">Other</option></select></div></div><div class="field"><label>Looking for (Relationship Intent)</label><select id="lookingFor"><option value="any">Open to anything ✨</option><option value="long-term">Long-term relationship 💍</option><option value="casual">Casual dating ☕</option><option value="friends">New friends 🤝</option><option value="not-sure">Not sure yet 🤔</option></select></div><div class="field"><label>Email</label><input id="email" type="email"></div><div class="field"><label>Password (8+ characters)</label><input id="password" type="password"></div><button class="btn" style="width:100%" onclick="signup()">Create account ❤️</button><div id="msg" class="msg"></div></main><script src="/js/app.js"></script><script>
let selectedProfileImage = "";

function compressSignupImage(file, maxDimension = 1000, quality = 0.85) {
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onerror = reject;
    reader.onload = (e) => {
      const img = new Image();
      img.onerror = reject;
      img.onload = () => {
        let width = img.width;
        let height = img.height;
        if (width > maxDimension || height > maxDimension) {
          if (width > height) {
            height = Math.round((height * maxDimension) / width);
            width = maxDimension;
          } else {
            width = Math.round((width * maxDimension) / height);
            height = maxDimension;
          }
        }
        const canvas = document.createElement("canvas");
        canvas.width = width;
        canvas.height = height;
        const ctx = canvas.getContext("2d");
        ctx.drawImage(img, 0, 0, width, height);
        resolve(canvas.toDataURL("image/jpeg", quality));
      };
      img.src = e.target.result;
    };
    reader.readAsDataURL(file);
  });
}

document.getElementById("signupPhotoInput")?.addEventListener("change", async (e) => {
  const file = e.target.files && e.target.files[0];
  if (!file) return;
  if (!file.type.startsWith("image/")) {
    document.getElementById("msg").textContent = "Please select a valid image file (JPG, PNG, WebP).";
    return;
  }
  try {
    document.getElementById("photoStatus").textContent = "Processing photo...";
    selectedProfileImage = await compressSignupImage(file);
    const imgEl = document.getElementById("avatarPreviewImg");
    imgEl.src = selectedProfileImage;
    imgEl.style.display = "block";
    document.getElementById("avatarPlaceholderIcon").style.display = "none";
    document.getElementById("avatarPlaceholderText").style.display = "none";
    document.getElementById("photoStatus").textContent = "✅ Profile photo ready!";
    document.getElementById("photoStatus").style.color = "#4ade80";
  } catch (err) {
    console.error(err);
    document.getElementById("photoStatus").textContent = "Could not load photo. Try another.";
  }
});

async function signup(){
  const msg=document.getElementById("msg");
  const name=document.getElementById("name").value.trim();
  const age=document.getElementById("age").value;
  const gender=document.getElementById("gender").value;
  const lookingFor=document.getElementById("lookingFor").value;
  const email=document.getElementById("email").value.trim();
  const password=document.getElementById("password").value;
  if(!selectedProfileImage){
    msg.textContent="Profile picture is mandatory! Please upload a photo 📸";
    document.getElementById("avatarPreviewBox").scrollIntoView({ behavior: "smooth", block: "center" });
    return;
  }
  if(!name||!age||!gender||!email||!password){msg.textContent="Please fill all fields";return;}
  msg.textContent="Creating account...";
  try{
    const result=await HM.api("/api/auth/signup",{method:"POST",body:{name,age,gender,lookingFor,email,password,profileImage:selectedProfileImage}});
    if(!result.r.ok){msg.textContent=result.d.message||"Signup failed";return;}
    msg.textContent=result.d.message||"Account created successfully ❤️";
    if(result.d.verificationUrl){const a=document.createElement("a");a.href=result.d.verificationUrl;a.textContent=" Verify email";a.style.display="block";a.style.marginTop="10px";msg.appendChild(a);}
    setTimeout(()=>location.href="login.html",5000);
  }catch(e){console.error(e);msg.textContent="Cannot connect to server. Open this page through http://localhost:5000";}
}
</script>  <script src="js/animated-ui.js"></script>
  <script src="/js/pwa-install.js" defer></script>
</body></html>
